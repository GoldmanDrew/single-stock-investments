name: Deploy dashboard to Cloudflare Pages and D1
description: Build the safe static artifact, synchronize D1, and deploy Pages.
inputs:
  project-name:
    description: Cloudflare Pages project name
    required: false
    default: single-stock-investments
  database-name:
    description: Cloudflare D1 database name
    required: false
    default: single-stock-investments
  private-artifacts-bucket:
    description: Private R2 bucket for immutable portfolio evidence
    required: false
    default: single-stock-investments-private
  ingest-worker-name:
    description: Public edge Worker used only for signed market-risk ingestion
    required: false
    default: single-stock-market-risk-ingest
outputs:
  page_url:
    description: URL reported by the Cloudflare Pages deployment
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Install pinned Cloudflare tooling
      shell: bash
      run: npm ci --prefix dashboard/cloudflare

    - name: Verify Cloudflare boundary and function contracts
      shell: bash
      run: |
        set -euo pipefail
        npm --prefix dashboard/cloudflare run check
        python -m pytest -q _system/scripts/test_build_cloudflare_pages_site.py _system/trading/portfolio_hub/tests

    - name: Build Cloudflare-safe dashboard artifact
      shell: bash
      run: |
        set -euo pipefail
        python _system/scripts/build_cloudflare_pages_site.py
        python _system/scripts/validate_portfolio_private_boundary.py _cf_project/site
        mkdir -p _cf_project/functions
        cp -R dashboard/functions/. _cf_project/functions/

    - name: Ensure Pages project and D1 database exist
      id: resources
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        DATABASE_NAME: ${{ inputs.database-name }}
        INGEST_WORKER_NAME: ${{ inputs.ingest-worker-name }}
        PRIVATE_BUCKET: ${{ inputs.private-artifacts-bucket }}
      run: |
        set -euo pipefail
        WRANGLER="dashboard/cloudflare/node_modules/.bin/wrangler"

        project_exists() {
          local projects
          projects="$("$WRANGLER" pages project list --json 2>/dev/null || true)"
          jq -e --arg name "$PROJECT_NAME" '
            (if type == "array" then .
             elif type == "object" then (.result // .projects // [])
             else [] end)
            | any((.name // .project_name) == $name)
          ' <<<"$projects" >/dev/null 2>&1
        }

        if ! project_exists; then
          CREATE_LOG="$RUNNER_TEMP/cf-pages-create.log"
          if ! "$WRANGLER" pages project create "$PROJECT_NAME" \
            --production-branch=main \
            --compatibility-date=2026-08-17 \
            --compatibility-flag=nodejs_compat \
            >"$CREATE_LOG" 2>&1; then
            if ! grep -Eqi 'already exists|8000002' "$CREATE_LOG"; then
              cat "$CREATE_LOG" >&2
              exit 1
            fi
            echo "Pages project $PROJECT_NAME already exists; continuing."
          fi
        fi

        resolve_database_id() {
          local databases
          databases="$("$WRANGLER" d1 list --json 2>/dev/null || true)"
          jq -r --arg name "$DATABASE_NAME" '
            (if type == "array" then .
             elif type == "object" then (.result // [])
             else [] end)
            | .[] | select((.name // .database_name) == $name)
            | (.uuid // .database_id) // empty
          ' <<<"$databases" | head -n1
        }

        DATABASE_ID="$(resolve_database_id)"
        if [ -z "$DATABASE_ID" ]; then
          CREATE_LOG="$RUNNER_TEMP/cf-d1-create.log"
          if ! "$WRANGLER" d1 create "$DATABASE_NAME" --location=enam \
            >"$CREATE_LOG" 2>&1; then
            if ! grep -Eqi 'already exists|300002' "$CREATE_LOG"; then
              cat "$CREATE_LOG" >&2
              exit 1
            fi
            echo "D1 database $DATABASE_NAME already exists; continuing."
          fi
          DATABASE_ID="$(resolve_database_id)"
        fi

        BUCKETS="$($WRANGLER r2 bucket list --json 2>/dev/null || true)"
        if ! jq -e --arg name "$PRIVATE_BUCKET" '
          (if type == "array" then . elif type == "object" then (.buckets // .result // []) else [] end)
          | any((.name // .bucket) == $name)
        ' <<<"$BUCKETS" >/dev/null 2>&1; then
          "$WRANGLER" r2 bucket create "$PRIVATE_BUCKET"
        fi
        if [ -z "$DATABASE_ID" ]; then
          echo "Cloudflare did not return a database ID for $DATABASE_NAME" >&2
          exit 1
        fi

        jq -n \
          --arg name "$PROJECT_NAME" \
          --arg database_name "$DATABASE_NAME" \
          --arg database_id "$DATABASE_ID" \
          --arg private_bucket "$PRIVATE_BUCKET" \
          '{
            name: $name,
            compatibility_date: "2026-08-17",
            compatibility_flags: ["nodejs_compat"],
            pages_build_output_dir: "./site",
            d1_databases: [{
              binding: "DB",
              database_name: $database_name,
              database_id: $database_id,
              migrations_dir: "../dashboard/cloudflare/migrations"
            }],
            r2_buckets: [{ binding: "PRIVATE_ARTIFACTS", bucket_name: $private_bucket }]
          }' > _cf_project/wrangler.jsonc
        jq -n \
          --arg name "$INGEST_WORKER_NAME" \
          --arg database_name "$DATABASE_NAME" \
          --arg database_id "$DATABASE_ID" \
          '{
            name: $name,
            main: "../dashboard/cloudflare/market-risk-ingest-worker.js",
            compatibility_date: "2026-08-17",
            compatibility_flags: ["nodejs_compat"],
            workers_dev: true,
            d1_databases: [{
              binding: "DB",
              database_name: $database_name,
              database_id: $database_id
            }]
          }' > _cf_project/wrangler.market-risk.jsonc
        echo "database_id=$DATABASE_ID" >> "$GITHUB_OUTPUT"

    - name: Apply D1 schema and synchronize current dashboard state
      shell: bash
      env:
        DATABASE_NAME: ${{ inputs.database-name }}
      run: |
        set -euo pipefail
        WRANGLER="dashboard/cloudflare/node_modules/.bin/wrangler"
        "$WRANGLER" d1 migrations apply DB --remote \
          --config _cf_project/wrangler.jsonc
        python _system/scripts/export_dashboard_d1_seed.py
        "$WRANGLER" d1 execute DB --remote --yes \
          --file dashboard/cloudflare/generated/dashboard_seed.sql \
          --config _cf_project/wrangler.jsonc

    - name: Configure private Pages secrets and deploy signed market-risk ingest Worker
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        INGEST_WORKER_NAME: ${{ inputs.ingest-worker-name }}
      run: |
        set -euo pipefail
        if [ -z "${MARKET_RISK_INGEST_TOKEN:-}" ]; then
          echo "MARKET_RISK_INGEST_TOKEN is required for the signed risk ingest." >&2
          exit 1
        fi
        if [ -z "${PORTFOLIO_INGEST_TOKEN:-}" ] || [ -z "${CF_ACCESS_TEAM_DOMAIN:-}" ] || [ -z "${CF_ACCESS_AUD:-}" ] || [ -z "${IBKR_ACCOUNT_IDS_FOR_SCAN:-}" ]; then
          echo "PORTFOLIO_INGEST_TOKEN, CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, and IBKR_ACCOUNT_IDS_FOR_SCAN are required for the private portfolio." >&2
          exit 1
        fi
        WRANGLER="dashboard/cloudflare/node_modules/.bin/wrangler"
        SECRET_FILE="$RUNNER_TEMP/market-risk-pages-secrets.json"
        trap 'rm -f "$SECRET_FILE"' EXIT
        python - "$SECRET_FILE" <<'PY'
        import json, os, sys
        secrets = {
            "MARKET_RISK_INGEST_TOKEN": os.environ["MARKET_RISK_INGEST_TOKEN"],
            "PORTFOLIO_INGEST_TOKEN": os.environ["PORTFOLIO_INGEST_TOKEN"],
            "CF_ACCESS_TEAM_DOMAIN": os.environ["CF_ACCESS_TEAM_DOMAIN"],
            "CF_ACCESS_AUD": os.environ["CF_ACCESS_AUD"],
        }
        token = os.environ.get("SLEEVE_INGEST_TOKEN")
        if token:
            secrets["SLEEVE_INGEST_TOKEN"] = token
        with open(sys.argv[1], "w", encoding="utf-8") as handle:
            json.dump(secrets, handle)
        PY
        "$WRANGLER" pages secret bulk "$SECRET_FILE" --project-name="$PROJECT_NAME"
        DEPLOY_LOG="$RUNNER_TEMP/market-risk-worker-deploy.log"
        "$WRANGLER" deploy --config _cf_project/wrangler.market-risk.jsonc 2>&1 | tee "$DEPLOY_LOG"
        printf '%s' "$MARKET_RISK_INGEST_TOKEN" \
          | "$WRANGLER" secret put MARKET_RISK_INGEST_TOKEN \
              --config _cf_project/wrangler.market-risk.jsonc
        INGEST_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' "$DEPLOY_LOG" | tail -n1 || true)"
        {
          echo "### Market-risk ingest"
          echo
          echo "- Worker: \`$INGEST_WORKER_NAME\`"
          if [ -n "$INGEST_URL" ]; then
            echo "- Signed endpoint: ${INGEST_URL}/api/v1/market-risk/ingest"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Deploy Cloudflare Pages
      id: deploy
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
      run: |
        set -euo pipefail
        WRANGLER="../dashboard/cloudflare/node_modules/.bin/wrangler"
        DEPLOY_LOG="$RUNNER_TEMP/single-stock-cloudflare-deploy.log"
        (
          cd _cf_project
          "$WRANGLER" pages deploy site \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
        ) 2>&1 | tee "$DEPLOY_LOG"
        PAGE_URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$DEPLOY_LOG" | tail -n1 || true)"
        echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
        {
          echo "### Cloudflare dashboard"
          echo
          echo "- Pages project: \`$PROJECT_NAME\`"
          echo "- D1 binding: \`DB\`"
          if [ -n "$PAGE_URL" ]; then
            echo "- Deployment: $PAGE_URL"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify unauthenticated portfolio denial
      shell: bash
      env:
        PAGE_URL: ${{ steps.deploy.outputs.page_url }}
      run: |
        set -euo pipefail
        if [ -z "$PAGE_URL" ]; then
          echo "Could not determine deployment URL for privacy verification." >&2
          exit 1
        fi
        BOOK_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$PAGE_URL/api/v2/portfolio/book")"
        STATIC_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$PAGE_URL/data/sleeves_drew.json")"
        if [ "$BOOK_STATUS" = "200" ] || [ "$STATIC_STATUS" = "200" ]; then
          echo "Private portfolio boundary failed: book=$BOOK_STATUS static=$STATIC_STATUS" >&2
          exit 1
        fi
        echo "Private portfolio boundary verified: book=$BOOK_STATUS static=$STATIC_STATUS"
