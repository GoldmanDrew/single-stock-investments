name: Bootstrap SPX Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SPX dashboard
        uses: actions/checkout@v4
        with:
          repository: magis-capital-partners/spx-0dte
          token: ${{ secrets.SPX_BOOTSTRAP_TOKEN }}
          path: spx

      - name: Ensure Pages project + deploy docs
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: spx-0dte
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing Magis CLOUDFLARE_* secrets on SSI." >&2
            exit 1
          fi

          projects="$(npx --yes wrangler@4 pages project list --json 2>/dev/null || true)"
          if ! jq -e --arg name "$PROJECT_NAME" '
            (if type == "array" then .
             elif type == "object" then (.result // .projects // [])
             else [] end)
            | any((.name // .project_name) == $name)
          ' <<<"$projects" >/dev/null 2>&1; then
            CREATE_LOG="$RUNNER_TEMP/cf-pages-create.log"
            if ! npx --yes wrangler@4 pages project create "$PROJECT_NAME" \
              --production-branch=main \
              >"$CREATE_LOG" 2>&1; then
              if ! grep -Eqi 'already exists|8000002' "$CREATE_LOG"; then
                cat "$CREATE_LOG" >&2
                exit 1
              fi
            fi
          fi

          projects="$(npx --yes wrangler@4 pages project list --json 2>/dev/null || true)"
          SUBDOMAIN="$(jq -r --arg name "$PROJECT_NAME" '
            (if type == "array" then .
             elif type == "object" then (.result // .projects // [])
             else [] end)
            | .[] | select((.name // .project_name) == $name)
            | (.subdomain // .domains[0] // empty)
          ' <<<"$projects" | head -n1)"
          if [ -z "$SUBDOMAIN" ]; then
            SUBDOMAIN="${PROJECT_NAME}.pages.dev"
          fi
          case "$SUBDOMAIN" in
            *.pages.dev) ;;
            *) SUBDOMAIN="${SUBDOMAIN}.pages.dev" ;;
          esac
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"
          echo "Resolved Pages host: $SUBDOMAIN"

          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.bak' \
            --exclude '*.pdf' \
            --exclude 'build_dashboard.log' \
            spx/docs/ _site/

          DEPLOY_LOG="$RUNNER_TEMP/spx-bootstrap-deploy.log"
          npx --yes wrangler@4 pages deploy _site \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true \
            2>&1 | tee "$DEPLOY_LOG"
          PAGE_URL="$(grep -Eo 'https://[^ ]+\.pages\.dev' "$DEPLOY_LOG" | tail -n1 || true)"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${PAGE_URL:-$SUBDOMAIN}"

      - name: Configure Access (dgoldman + mcricenti only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN: ${{ steps.deploy.outputs.subdomain }}
        run: |
          set -euo pipefail
          AID="$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          cf() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -X "$method" "https://api.cloudflare.com/client/v4$path" \
                -H "$AUTH" -H 'Content-Type: application/json' --data "$body"
            else
              curl -sS -X "$method" "https://api.cloudflare.com/client/v4$path" \
                -H "$AUTH" -H 'Content-Type: application/json'
            fi
          }

          idps="$(cf GET "/accounts/$AID/access/identity_providers")"
          OTP_ID="$(jq -r '.result[] | select(.type=="onetimepin") | .id' <<<"$idps" | head -n1)"
          if [ -z "$OTP_ID" ] || [ "$OTP_ID" = "null" ]; then
            created="$(cf POST "/accounts/$AID/access/identity_providers" '{"name":"One-time PIN","type":"onetimepin","config":{}}')"
            OTP_ID="$(jq -r '.result.id' <<<"$created")"
          fi
          echo "OTP IdP: $OTP_ID"

          POLICY_NAME='Allow Magis principals (dgoldman, mcricenti)'
          policies="$(cf GET "/accounts/$AID/access/policies")"
          POLICY_ID="$(jq -r --arg n "$POLICY_NAME" '.result[] | select(.name==$n) | .id' <<<"$policies" | head -n1)"
          POLICY_BODY="$(jq -n --arg name "$POLICY_NAME" '{name:$name,decision:"allow",include:[{email:{email:"drewgoldman01@gmail.com"}},{email:{email:"michael.cricenti@gmail.com"}}],exclude:[],require:[]}')"
          created=""; updated=""
          if [ -n "$POLICY_ID" ] && [ "$POLICY_ID" != "null" ]; then
            updated="$(cf PUT "/accounts/$AID/access/policies/$POLICY_ID" "$POLICY_BODY")"
            POLICY_ID="$(jq -r '.result.id // empty' <<<"$updated")"
            echo "Updated reusable policy $POLICY_ID"
          else
            created="$(cf POST "/accounts/$AID/access/policies" "$POLICY_BODY")"
            POLICY_ID="$(jq -r '.result.id' <<<"$created")"
            echo "Created reusable policy $POLICY_ID"
          fi
          if [ -z "$POLICY_ID" ] || [ "$POLICY_ID" = "null" ]; then
            echo "Failed to create/update Access policy:" >&2
            echo "$created$updated" >&2
            exit 1
          fi

          HOST="$SUBDOMAIN"
          PREVIEW="*.${HOST}"
          APP_NAME='SPX 0DTE Dashboard'
          apps="$(cf GET "/accounts/$AID/access/apps?per_page=50")"
          APP_ID="$(jq -r --arg d "$HOST" '.result[] | select(.domain==$d) | .id' <<<"$apps" | head -n1)"
          APP_BODY="$(jq -n --arg name "$APP_NAME" --arg domain "$HOST" --arg preview "$PREVIEW" --arg otp "$OTP_ID" --arg policy "$POLICY_ID" '{name:$name,type:"self_hosted",domain:$domain,destinations:[{type:"public",uri:$domain},{type:"public",uri:$preview}],session_duration:"24h",auto_redirect_to_identity:false,app_launcher_visible:true,allowed_idps:[$otp],policies:[{id:$policy,precedence:1}]}')"
          if [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ]; then
            result="$(cf PUT "/accounts/$AID/access/apps/$APP_ID" "$APP_BODY")"
          else
            result="$(cf POST "/accounts/$AID/access/apps" "$APP_BODY")"
          fi
          ok="$(jq -r '.success' <<<"$result")"
          if [ "$ok" != "true" ]; then
            echo "Access app upsert failed:" >&2
            echo "$result" >&2
            exit 1
          fi
          echo "Access app ready for https://$HOST"
          {
            echo "### Access"
            echo "- Host: https://$HOST"
            echo "- Allow: drewgoldman01@gmail.com, michael.cricenti@gmail.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copy Magis Cloudflare secrets to spx-0dte
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.SPX_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_API_TOKEN" | gh secret set CLOUDFLARE_API_TOKEN --repo magis-capital-partners/spx-0dte
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | gh secret set CLOUDFLARE_ACCOUNT_ID --repo magis-capital-partners/spx-0dte
          echo "Copied CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to spx-0dte"