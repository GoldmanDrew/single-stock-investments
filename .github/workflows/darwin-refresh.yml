name: Darwin Portfolio Refresh

# DISABLED INDEFINITELY 2026-08-23, by request.
#
# Also disabled in the GitHub UI (state: disabled_manually). Both, deliberately:
# the UI state is invisible in code and a fresh clone gives no hint, while the
# commented cron is invisible to the API. Whoever re-enables one should find the
# other and read this.
#
# It had failed every run since 2026-08-11 for the same reason Letter Backfill
# did: it checks out `ci_checkout_workspace.sh darwin` -- a sparse profile whose
# own step name says "no ticker PDF trees" -- and then runs
# build_dashboard_data.py, which walks those trees. Every infra stat computed to
# zero and the clobber guard correctly refused:
#
#   Refusing to write dashboard_data.json: ... pdf_count 143->0; readme 830->0;
#   research_dir 833->0; total_pdfs 8615->0 (floor 100)
#
# So this is NOT unfixable -- it is the same one-line mismatch fixed in
# letter-backfill.yml, and the ticker payload it wants is rebuilt nightly anyway
# by data-pipeline.yml intake-full on a full checkout. It is off because it is
# not wanted, not because it cannot work.
#
# To re-enable: restore the triggers below, `gh workflow enable "Darwin Portfolio
# Refresh"`, re-add the `darwin` lane to _system/graph/graph_sources.json, and
# fix the sparse/rebuild mismatch first or it will simply fail again.
on:
  workflow_dispatch:
# schedule:
#   - cron: "20 1 * * 1-5"
# push:
#   branches: [main]
#   paths:
#     - "_system/scripts/*darwin*"
#     - "_system/config/darwin*"
#     - ".github/workflows/darwin-refresh.yml"

permissions:
  contents: write

concurrency:
  group: data-commit-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESEARCH_VAULT_REPO_URL: ${{ secrets.RESEARCH_VAULT_REPO_URL }}
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      RESEARCH_VAULT_ROOT: _external/research-vault
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (sparse — no ticker PDF trees)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          COUNT=$(python3 _system/scripts/ci_sparse_checkout_paths.py --count darwin)
          echo "darwin sparse extra paths=$COUNT (cap 200)"
          if [ "$COUNT" -gt 200 ]; then
            echo "::error::darwin sparse profile exploded ($COUNT paths). Aborting."
            exit 1
          fi
          bash _system/scripts/ci_checkout_workspace.sh darwin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild Darwin portfolio and dashboard data
        uses: ./.github/actions/rebuild-data
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
        with:
          profile: darwin-full

      - name: Refresh compact Darwin research contract
        run: python _system/scripts/build_darwin_research_snapshot.py

      - name: Commit artifacts
        uses: ./.github/actions/commit-main
        with:
          message: "chore(darwin): refresh portfolio and market data"
          git_add: "-A"

      - name: Pipeline summary
        run: echo "Darwin Portfolio Refresh complete. Deploy Dashboard chains via workflow_run."
