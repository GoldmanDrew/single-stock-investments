name: Data Pipeline

# Single scheduled writer lane for deterministic data jobs.

on:
  repository_dispatch:
    types: [heal-technicals, heal-warrants]
  schedule:
    - cron: "0 3 * * *"     # nightly intake-full
    - cron: "15 2 * * 1-5"  # weekday technical fear/capitulation refresh
    - cron: "0 6 * * *"     # activist scan
    - cron: "0 12 * * 1,2,4,5,6" # light portfolio refresh
    - cron: "0 10 * * 0,3"  # full document harvest twice weekly
    - cron: "0 14 * * *"    # drive intake (daily)
    - cron: "30 */6 * * *"  # portfolio news
    - cron: "0 15 * * 1"    # CVR discovery (SEC + inbox) Mondays
    - cron: "0 16 * * 0"    # World Model weekly (Sunday UTC: themes + KPI ledgers + strip)

# Concurrency: each job below takes its own queue (data-commit-main-<job>)
# rather than one shared "data-commit-main" group. GitHub Actions keeps at most
# one *pending* run per concurrency group and cancels any earlier pending run,
# so a single shared group let a long-running 03:00 job evict the 06:00 activist
# scan while it sat in the queue. Those runs report "cancelled", not "failed",
# so no red X ever appeared and the activist feed silently stopped updating on
# 2026-08-02. Concurrent pushes to main remain safe because every job commits
# through .github/actions/commit-main, which rebases and retries.
permissions:
  contents: write
  pull-requests: write

# Serialize writers across workflows without cancelling a long downloads run.
# Each committing job opts into data-commit-main below.

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      intake_full: ${{ steps.pick.outputs.intake_full }}
      activist: ${{ steps.pick.outputs.activist }}
      downloads: ${{ steps.pick.outputs.downloads }}
      download_mode: ${{ steps.pick.outputs.download_mode }}
      drive: ${{ steps.pick.outputs.drive }}
      news: ${{ steps.pick.outputs.news }}
      cvr_discover: ${{ steps.pick.outputs.cvr_discover }}
      warrant_discover: ${{ steps.pick.outputs.warrant_discover }}
      world_model: ${{ steps.pick.outputs.world_model }}
      technicals: ${{ steps.pick.outputs.technicals }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          intake_full=false; activist=false; downloads=false; drive=false; news=false; cvr_discover=false; warrant_discover=false; world_model=false; technicals=false; download_mode=light
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then SCHEDULE="dispatch:$EVENT_ACTION"; fi
          case "$SCHEDULE" in
            "dispatch:heal-technicals") technicals=true ;;
            "dispatch:heal-warrants") warrant_discover=true ;;
            "0 3 * * *") intake_full=true ;;
            "15 2 * * 1-5") technicals=true ;;
            "0 6 * * *") activist=true ;;
            "0 12 * * 1,2,4,5,6") downloads=true; download_mode=light ;;
            "0 10 * * 0,3") downloads=true; download_mode=full ;;
            "0 14 * * *") drive=true ;;
            "30 */6 * * *") news=true ;;
            "0 15 * * 1") cvr_discover=true; warrant_discover=true ;;
            "0 16 * * 0") world_model=true ;;
            *) echo "::error::Unrecognized schedule='$SCHEDULE'"; exit 1 ;;
          esac
          {
            echo "intake_full=$intake_full"
            echo "activist=$activist"
            echo "downloads=$downloads"
            echo "download_mode=$download_mode"
            echo "drive=$drive"
            echo "news=$news"
            echo "cvr_discover=$cvr_discover"
            echo "warrant_discover=$warrant_discover"
            echo "world_model=$world_model"
            echo "technicals=$technicals"
          } >> "$GITHUB_OUTPUT"
          echo "Selected: intake_full=$intake_full technicals=$technicals activist=$activist downloads=$downloads($download_mode) drive=$drive news=$news cvr_discover=$cvr_discover world_model=$world_model"

  intake-full:
    needs: decide
    if: needs.decide.outputs.intake_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    env:
      RESEARCH_VAULT_REPO_URL: ${{ secrets.RESEARCH_VAULT_REPO_URL }}
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      RESEARCH_VAULT_ROOT: _external/research-vault
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        run: bash _system/scripts/ci_checkout_workspace.sh full
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nightly intake-full rebuild
        uses: ./.github/actions/rebuild-data
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        with:
          profile: full
          validate: "true"
      - name: Commit artifacts
        uses: ./.github/actions/commit-main
        with:
          message: "chore: nightly intake-full $(date -u +%Y-%m-%d)"

  technicals:
    needs: decide
    if: needs.decide.outputs.technicals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout dashboard data workspace
        run: bash _system/scripts/ci_checkout_workspace.sh dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install criticality model dependencies
        run: pip install -r _system/scripts/requirements-criticality.txt
      - id: technical_health
        name: Refresh free technical fear and capitulation signals
        continue-on-error: true
        run: |
          # The repair event targets stale price/technical outputs. The
          # portfolio-wide float/ADV crawl is a separate slow input and can
          # consume the entire 30-minute job; keep its last-known-good cache on
          # repair runs so the actual stale artifacts are rebuilt promptly.
          if [ "${{ github.event.action }}" != "heal-technicals" ]; then
            python _system/scripts/fetch_float_adv.py --no-sec-fallback --sleep 0.05
          fi
          python _system/scripts/build_technical_signals.py --workers 12
          python _system/scripts/build_criticality_signals.py --workers 4
          # dashboard_data.json is an intentionally gitignored build
          # intermediate. This sparse repair checkout validates the committed
          # browser payload instead of requiring that absent monolith.
          CI_PAGES_DEPLOY_ONLY=1 python _system/scripts/validate_dashboard_data.py
      - name: Refresh vol metrics and the SPX surface snapshot
        if: always()
        # Same lane rather than a new cron slot: the decide job case-matches
        # exact cron strings and hard-errors on an unrecognized one, so a new
        # slot means editing three places (corrections.md rename trap). This
        # lane already runs the Yahoo-sourced builders on the same cadence,
        # and 02:15 UTC Mon-Fri lands after the prior US close, which is what
        # the delayed CBOE chain needs. Both builders preserve their prior
        # rows and stamp quality_state='stale' on a source hiccup, so a
        # vendor outage cannot fail the lane.
        #
        # ORDER MATTERS: the surface builds FIRST. build_vol_metrics reads
        # spx_surface_latest.json to resolve term_state when ^VIX3M has no
        # print, so running it first made the fallback read yesterday's chain.
        # build_spx_surface has no dependency on vol metrics, so this is free.
        run: |
          python _system/scripts/build_spx_surface.py
          python _system/scripts/build_vol_metrics.py
          python _system/scripts/build_capitulation_daily.py --workers 6
      - name: Commit technical snapshots
        if: always()
        uses: ./.github/actions/commit-main
        with:
          message: "chore: refresh technical fear signals $(date -u +%Y-%m-%d)"
          git_add: >-
            dashboard/data/technical_signals.json
            dashboard/data/technical_summary.json
            dashboard/data/criticality_summary.json
            dashboard/data/vol_metrics_latest.json
            dashboard/data/vol_metrics_history.jsonl
            dashboard/data/spx_surface_latest.json
            dashboard/data/spx_surface_history.jsonl
            dashboard/data/capitulation_daily.json
            dashboard/data/capitulation_daily_history.jsonl
            dashboard/data/capitulation_daily_state.json
      - name: Keep unresolved technical failures loud after preserving progress
        if: steps.technical_health.outcome == 'failure'
        run: |
          echo "::error::Technical snapshots were preserved, but their refresh or validation remains degraded."
          exit 1

  activist:
    needs: decide
    if: needs.decide.outputs.activist == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    env:
      RESEARCH_VAULT_REPO_URL: ${{ secrets.RESEARCH_VAULT_REPO_URL }}
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      RESEARCH_VAULT_ROOT: _external/research-vault
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        run: bash _system/scripts/ci_checkout_workspace.sh full
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r _system/scripts/requirements.txt
      - name: Run activist scan
        env:
          TICKER: ""
          SEC_ONLY: "false"
        run: |
          python _system/scripts/scan_activist_sources.py --reconcile --fetch-sec --discover-filers
          python _system/scripts/short_scan_batch.py
          python _system/scripts/activist_registry_audit.py
      - name: Japan large-shareholding reports (EDINET)
        # Exits 0 and prints "not configured" until EDINET_API_KEY exists, so
        # the lane can ship before the credential does. See
        # _system/reference/activist-reports/COVERAGE_DECISIONS.md
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python _system/scripts/edinet_activist_scan.py
      - name: Activist coverage guards
        run: python -m unittest _system/scripts/test_activist_coverage.py _system/scripts/test_activist_taxonomy.py
      - name: Rebuild activist dashboard slice
        uses: ./.github/actions/rebuild-data
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
        with:
          profile: activist
          validate: "true"
      - name: Commit artifacts
        uses: ./.github/actions/commit-main
        with:
          message: "chore: activist scan sync $(date -u +%Y-%m-%d)"
      # Runs after the commit and always, so it judges what actually shipped.
      # A job that is cancelled while pending never reaches this step -- which
      # is the point: the NEXT run then sees a stale feed and goes red, so the
      # silence that hid three weeks of evictions cannot repeat.
      - name: Assert the activist feed actually moved
        if: always()
        run: python _system/scripts/check_activist_freshness.py

  downloads:
    needs: decide
    if: needs.decide.outputs.downloads == 'true'
    runs-on: ubuntu-latest
    # Each run is bounded and resumable.  A single issuer endpoint cannot hold
    # the Actions worker for GitHub's six-hour hard maximum.
    timeout-minutes: 270
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        run: bash _system/scripts/ci_checkout_workspace.sh full
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transcript pipeline dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          pip install -r _system/scripts/requirements.txt -r _system/scripts/requirements-transcripts.txt
      - name: Run portfolio downloads
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_IO_API_KEY }}
          POLYGON_EARNINGS_CACHE_MAX_AGE_HOURS: "36"
          DOWNLOAD_MODE: ${{ needs.decide.outputs.download_mode }}
        run: |
          if [ "$DOWNLOAD_MODE" = "light" ]; then
            python _system/scripts/download_all_holdings.py --light --skip-indexes
          else
            python _system/scripts/download_all_holdings.py --batch-size 8 --skip-aggregate-harvest
          fi
      - name: Commit and push workspace
        uses: ./.github/actions/commit-main
        with:
          message: "chore: daily download sync $(date -u +%Y-%m-%d)"

  drive:
    needs: decide
    if: needs.decide.outputs.drive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    outputs:
      imported: ${{ steps.import.outputs.imported }}
      warnings: ${{ steps.import.outputs.warnings }}
      errors: ${{ steps.import.outputs.errors }}
      report_changed: ${{ steps.import.outputs.report_changed }}
    env:
      RESEARCH_VAULT_REPO_URL: ${{ secrets.RESEARCH_VAULT_REPO_URL }}
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      RESEARCH_VAULT_ROOT: _external/research-vault
    steps:
      - name: Check Google credentials secret
        id: google_creds
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            MSG="GOOGLE_APPLICATION_CREDENTIALS_JSON is not configured."
            echo "::error::Drive Intake cannot run — ${MSG}"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        run: bash _system/scripts/ci_checkout_workspace.sh full
      - uses: actions/setup-python@v5
        if: steps.google_creds.outputs.configured == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.google_creds.outputs.configured == 'true'
        run: pip install -r _system/scripts/requirements.txt
      - name: Configure Google credentials
        if: steps.google_creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-service-account.json" >> "$GITHUB_ENV"
      - name: Import Drive intake PDFs
        if: steps.google_creds.outputs.configured == 'true'
        id: import
        run: |
          set -u
          set +e
          python _system/scripts/import_drive_intake.py --ensure-folders
          STATUS=$?
          set -e
          REPORT="_system/reference/document-store/drive_intake_latest.json"
          if git diff --quiet -- "$REPORT"; then
            export REPORT_CHANGED=false
          else
            export REPORT_CHANGED=true
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("_system/reference/document-store/drive_intake_latest.json")
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else {}
          summary = report.get("summary") or {}
          values = {
              "imported": int(summary.get("imported_count", 0)),
              "warnings": int(summary.get("warning_count", 0)),
              "errors": int(summary.get("error_count", 0)),
              "report_changed": os.environ.get("REPORT_CHANGED", "false"),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")

          lines = [
              "### Drive intake",
              "",
              "| Imported | Skipped | Warnings | Errors | Report changed |",
              "|---:|---:|---:|---:|:---:|",
              (
                  f"| {values['imported']} | {int(summary.get('skipped_count', 0))} | "
                  f"{values['warnings']} | {values['errors']} | {values['report_changed']} |"
              ),
          ]
          warnings = report.get("warnings") or []
          if warnings:
              lines.extend(["", "#### Unresolved intake"])
              for warning in warnings[:25]:
                  path = warning.get("path") or warning.get("filename") or warning.get("drive_file_id")
                  error = warning.get("error") or "warning"
                  candidates = ", ".join(warning.get("ticker_candidates") or [])
                  suffix = f" (candidates: {candidates})" if candidates else ""
                  lines.append(f"- `{path}`: {error}{suffix}")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          print(
              "Drive intake "
              f"imported={values['imported']} warnings={values['warnings']} "
              f"errors={values['errors']} report_changed={values['report_changed']}"
          )
          PY
          exit "$STATUS"
      - name: Rebuild insights (only when files imported)
        id: rebuild
        if: >
          always() &&
          steps.google_creds.outputs.configured == 'true' &&
          steps.import.outputs.imported != '0'
        uses: ./.github/actions/rebuild-data
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
        with:
          profile: insights
          validate: "true"
      - name: Commit imported documents
        if: >
          always() &&
          steps.google_creds.outputs.configured == 'true' &&
          steps.import.outputs.imported != '0' &&
          steps.rebuild.conclusion == 'success'
        uses: ./.github/actions/commit-main
        with:
          message: "chore: sync Drive intake documents $(date -u +%Y-%m-%d)"
      - name: Commit updated intake report
        if: >
          always() &&
          steps.google_creds.outputs.configured == 'true' &&
          steps.import.outputs.imported == '0' &&
          steps.import.outputs.report_changed == 'true'
        uses: ./.github/actions/commit-main
        with:
          message: "chore: update Drive intake triage $(date -u +%Y-%m-%d)"
          git_add: "_system/reference/document-store/drive_intake_latest.json"
      - name: Skip note
        if: >
          steps.google_creds.outputs.configured == 'true' &&
          steps.import.outputs.imported == '0' &&
          steps.import.outputs.report_changed != 'true'
        run: echo "No Drive files imported and intake state is unchanged; skipping rebuild and commit."

  news:
    needs: decide
    if: needs.decide.outputs.news == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_IO_API_KEY }}
      PORTFOLIO_NEWS_WINDOW_DAYS: "30"
      PORTFOLIO_NEWS_POLYGON_REQS_PER_MIN: "5"
      PORTFOLIO_NEWS_MAX_PAGES: "15"
      PORTFOLIO_NEWS_GOOGLE_MAX_PER_QUERY: "50"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (sparse — news JSON only)
        run: bash _system/scripts/ci_checkout_workspace.sh news main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r _system/scripts/requirements-news.txt
      - name: Ingest portfolio news
        working-directory: _system/scripts
        run: python ingest_portfolio_news.py
      - name: Commit news artifacts
        run: |
          git add dashboard/data/portfolio_news.json _system/data/news_seen.json _system/reviews/pending/news_*.md
          git add '*/research/news/news_index.json' 2>/dev/null || true
          bash _system/scripts/ci_push_main.sh "chore: refresh portfolio news $(date -u +%Y-%m-%d)"

  cvr-discover:
    needs: decide
    if: needs.decide.outputs.cvr_discover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (CVR reference + scripts)
        run: bash _system/scripts/ci_checkout_workspace.sh minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CVR discovery (SEC + inbox + stubs, fail-soft)
        # Script exits 0 on EDGAR failures; discovery_state.unhealthy tracks streaks.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CVR_ALPHARANK_DROP_PATH: ${{ vars.CVR_ALPHARANK_DROP_PATH }}
        run: |
          # Free auto feeds (no keys): SEC EFTS + Google News RSS + SEC Atom.
          # Optional AlphaRank CSV drop / Slack if vars/secrets set.
          python _system/scripts/refresh_cvr_universe.py \
            --discover \
            --discover-non-sec-family \
            --ingest-inbox \
            --sync-alpharank \
            --create-stubs \
            --write-review \
            --alert \
            --skip-sync \
            --sleeve-policy ready \
            --discover-days 14 \
            --discover-limit 25
          python _system/scripts/check_cvr_universe.py || true
      - name: Stage stub ticker folders from universe
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          doc = json.loads(Path("_system/reference/cvr/cvr_universe.json").read_text(encoding="utf-8"))
          paths: list[str] = []
          for row in (doc.get("pre_close_opportunities") or []) + (doc.get("post_close_universe") or []):
              ticker = str(row.get("ticker") or "").strip()
              if not ticker:
                  continue
              for rel in (
                  f"{ticker}/README.md",
                  f"{ticker}/research/cvr_terms.json",
                  f"{ticker}/research/authorized_evidence.json",
                  f"{ticker}/research/research_agent_manifest.json",
              ):
                  if Path(rel).exists():
                      paths.append(rel)
          if paths:
              # Stubs are intentionally created outside the bootstrap sparse
              # checkout. --sparse stages them without expanding the checkout.
              subprocess.check_call(["git", "add", "--sparse", "--", *paths])
              print(f"staged {len(paths)} stub paths")
          else:
              print("no stub ticker paths to stage")
          PY
      - name: Commit discovery artifacts
        uses: ./.github/actions/commit-main
        with:
          message: |
            chore: CVR weekly discovery $(date -u +%Y-%m-%d)

            SEC full-text + inbox CSV + stubs into cvr_universe.json (context tier).
          git_add: >-
            _system/reference/cvr/
            _system/portfolio/investment_sleeves.json
            _system/portfolio/registry.json
            _system/reviews/pending/
            _system/data/cvr_agent_queue.json

  warrant-discover:
    needs: decide
    if: needs.decide.outputs.warrant_discover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout warrant workspace
        run: bash _system/scripts/ci_checkout_workspace.sh minimal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover, refresh, and resolve warrants
        # SEC and delayed-market failures preserve the last-known-good files;
        # discovery_state and the P6 feed invariant make repeated failure loud.
        run: |
          python _system/scripts/refresh_warrant_universe.py \
            --discover \
            --discover-days 14 \
            --discover-limit 50 \
            --refresh-market \
            --capture-cohort
          python _system/scripts/resolve_warrant_outcomes.py
          python _system/scripts/build_warrant_dashboard.py
      - id: warrant_health
        name: Validate warrant health after writing the truthful snapshot
        continue-on-error: true
        run: |
          set -euo pipefail
          python _system/scripts/check_warrant_universe.py --strict
      - name: Commit warrant artifacts
        if: always()
        uses: ./.github/actions/commit-main
        with:
          message: "chore: warrant weekly discovery $(date -u +%Y-%m-%d)"
          git_add: >-
            _system/data/warrants/
            dashboard/data/warrants.json
      - name: Keep unresolved source failures loud after preserving progress
        if: steps.warrant_health.outcome == 'failure'
        run: |
          echo "::error::Warrant snapshot was preserved, but strict health remains degraded."
          exit 1

  world-model:
    needs: decide
    if: needs.decide.outputs.world_model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Per-job queue - see the concurrency note at the top of this file.
      group: data-commit-main-${{ github.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        run: bash _system/scripts/ci_checkout_workspace.sh full
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: World Model monthly rebuild
        uses: ./.github/actions/rebuild-data
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
        with:
          profile: world-model-weekly
          validate: "false"
      - name: Commit World Model artifacts
        uses: ./.github/actions/commit-main
        with:
          message: "chore: world-model weekly $(date -u +%Y-%m-%d)"

  pipeline-summary:
    needs: [decide, intake-full, technicals, activist, downloads, drive, news, cvr-discover, warrant-discover, world-model]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          echo "Data Pipeline complete."
          echo "intake_full=${{ needs.decide.outputs.intake_full }} result=${{ needs.intake-full.result }}"
          echo "technicals=${{ needs.decide.outputs.technicals }} result=${{ needs.technicals.result }}"
          echo "activist=${{ needs.decide.outputs.activist }} result=${{ needs.activist.result }}"
          echo "downloads=${{ needs.decide.outputs.downloads }} result=${{ needs.downloads.result }}"
          echo "drive=${{ needs.decide.outputs.drive }} result=${{ needs.drive.result }} imported=${{ needs.drive.outputs.imported }} warnings=${{ needs.drive.outputs.warnings }} errors=${{ needs.drive.outputs.errors }} report_changed=${{ needs.drive.outputs.report_changed }}"
          echo "news=${{ needs.decide.outputs.news }} result=${{ needs.news.result }}"
          echo "cvr_discover=${{ needs.decide.outputs.cvr_discover }} result=${{ needs.cvr-discover.result }}"
          echo "warrant_discover=${{ needs.decide.outputs.warrant_discover }} result=${{ needs.warrant-discover.result }}"
          echo "world_model=${{ needs.decide.outputs.world_model }} result=${{ needs.world-model.result }}"
          echo "Deploy Dashboard chains via workflow_run on successful commits."
