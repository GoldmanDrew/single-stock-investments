name: Epistemic Falsifier Loop

on:
  schedule:
    - cron: "20 9 * * *"
  repository_dispatch:
    types: [falsifier-resolution-run]
permissions:
  contents: write

concurrency:
  group: data-commit-main
  cancel-in-progress: false

jobs:
  resolve-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh, resolve, and rebuild the control plane
        run: |
          set -euo pipefail
          python _system/scripts/promote_falsifier_drafts.py
          python _system/scripts/refresh_falsifier_evidence.py
          python _system/scripts/resolve_falsifiers.py --apply
          python _system/scripts/epistemic_loop_controller.py
      - name: Validate the post-resolution tree
        run: |
          set -euo pipefail
          python _system/scripts/lint_falsifier_specs.py
          python _system/scripts/check_falsifier_history.py --base-ref origin/main
          (cd _system/scripts && python -m unittest -v \
            test_falsifier_specs test_resolve_falsifiers \
            test_refresh_falsifier_evidence test_calibration_brief \
            test_epistemic_loop_integration test_epistemic_integrity \
            test_epistemic_loop_controller test_committee_forecast_loop)
          python _system/scripts/validate_calibration_consumption.py
          python _system/scripts/graph_invariants.py || true
          python _system/scripts/validate_invariant_subset.py E2 E3 E4 E5 E7 E8 E9
      - name: Publish loop status
        if: always()
        run: |
          {
            echo "### Epistemic loop"
            echo '```json'
            cat _system/research/epistemic_loop_status.json 2>/dev/null || true
            echo '```'
            cat _system/graph/INVARIANTS.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit outcomes, attempts, projections, and receipts
        id: commit
        uses: ./.github/actions/commit-main
        with:
          message: |
            chore(epistemic): daily evidence resolution and control-plane refresh

            Refresh evidence, resolve only immutable eligible forecasts, rebuild
            calibration and queues, and validate the resulting repository state.
          # The checkout starts clean and this ordered job is the sole writer.
          # -A safely includes optional newly created draft/release paths without
          # a shell glob becoming a fatal unmatched git pathspec.
          git_add: -A
      - name: Wake the research queue explicitly
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=research-queue-run
