name: Auto - Investment Committee

# A Power Zone commit creates committee_work. Each merged isolated-task PR
# changes that tree and automatically advances the next stage.
#
# Agent execution was removed here in 13d0534f2e ("disable committee agents");
# the repository variable COMMITTEE_AGENTS_ENABLED is the single switch that
# turns it back on. The re-freeze job is gated on the same variable: with no
# rater able to vote, re-freezing packets only churns supersede archives.
on:
  schedule:
    # Safety-net sweep every 4h; the repository_dispatch chain
    # (automerge -> advance-investment-committee) provides responsiveness.
    - cron: "17 */4 * * *"
  repository_dispatch:
    types: [advance-investment-committee]
  push:
    branches: [main]
    paths:
      - "*/research/committee_work/**/*.json"
      - "_system/scripts/committee_*.py"
      - "_system/scripts/investment_committee_pipeline.py"
      - ".github/workflows/investment-committee.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: investment-committee-auto
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ticker: ${{ steps.queue.outputs.ticker }}
      committee_date: ${{ steps.queue.outputs.committee_date }}
      action: ${{ steps.pending.outputs.action }}
      tasks: ${{ steps.pending.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /_system/scripts/**
            /*/research/committee_work/**
            /*/research/*.json
            /*/research/*.md
            /*/research/evidence/*.json
      - id: queue
        run: python _system/scripts/select_committee_work.py --github-output "$GITHUB_OUTPUT"
      - name: Exclude committee tasks with an open PR
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.queue.outputs.action }}
          TASKS_JSON: ${{ steps.queue.outputs.tasks }}
        run: |
          OPEN_TITLES=$(gh pr list --state open --limit 100 --json title --jq '[.[].title]')
          export OPEN_TITLES
          python - <<'PY'
          import json, os
          tasks = json.loads(os.environ.get("TASKS_JSON") or "[]")
          open_titles = set(json.loads(os.environ.get("OPEN_TITLES") or "[]"))
          filtered = [row for row in tasks if row["task_key"] not in open_titles]
          action = os.environ.get("ACTION") or "none"
          if action == "advance" and tasks and not filtered:
              action = "waiting"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"action={action}\n")
              handle.write("tasks=" + json.dumps(filtered, separators=(",", ":")) + "\n")
          print(f"committee action={action}; ready={len(filtered)}; already_in_flight={len(tasks) - len(filtered)}")
          PY
      - name: Report the parked refresh queue
        # refresh-stale-packet is gated on COMMITTEE_AGENTS_ENABLED, so with the
        # flag off a refresh action runs no job at all. Without this the run is
        # green having done nothing visible.
        if: steps.pending.outputs.action == 'refresh' && vars.COMMITTEE_AGENTS_ENABLED != 'true'
        env:
          TICKER: ${{ steps.queue.outputs.ticker }}
          COMMITTEE_DATE: ${{ steps.queue.outputs.committee_date }}
          REASON: ${{ steps.queue.outputs.reason }}
        run: |
          {
            echo "### Committee refresh held: COMMITTEE_AGENTS_ENABLED is off"
            echo ""
            echo "Next packet: **$TICKER** · date **$COMMITTEE_DATE** · reason \`$REASON\`."
            echo "No re-freeze runs while the flag is off; nothing is superseded and no vote is discarded."
            echo ""
            python _system/scripts/select_committee_work.py --refresh-backlog
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report parked committees awaiting a human
        # stage=parked is terminal, so select() and the refresh backlog both skip
        # it. Without this the packets a park is protecting - and the votes they
        # hold - are invisible to the human the park defers to. The held-refresh
        # step above already prints this section, so this runs only when it did
        # not.
        if: always() && (steps.pending.outputs.action != 'refresh' || vars.COMMITTEE_AGENTS_ENABLED == 'true')
        run: python _system/scripts/select_committee_work.py --parked >> "$GITHUB_STEP_SUMMARY"
      - name: Report the ordered Tier 1 execution queue
        if: always()
        run: python _system/scripts/build_committee_execution_queue.py --markdown >> "$GITHUB_STEP_SUMMARY"

  review-required:
    needs: prepare
    if: needs.prepare.outputs.action == 'advance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue bounded human committee review
        env:
          TICKER: ${{ needs.prepare.outputs.ticker }}
          COMMITTEE_DATE: ${{ needs.prepare.outputs.committee_date }}
          TASKS: ${{ needs.prepare.outputs.tasks }}
        run: |
          echo "### Committee review required" >> "$GITHUB_STEP_SUMMARY"
          echo "No Cursor Background Agent is started by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Ticker: **$TICKER** · packet date: **$COMMITTEE_DATE**" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$TASKS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  assemble:
    needs: prepare
    if: needs.prepare.outputs.action == 'assemble'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            _system
            dashboard/data
            ${{ needs.prepare.outputs.ticker }}/research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and assemble
        run: |
          python _system/scripts/committee_task_queue.py "${{ needs.prepare.outputs.ticker }}" --date "${{ needs.prepare.outputs.committee_date }}"
          python _system/scripts/investment_committee_pipeline.py validate "${{ needs.prepare.outputs.ticker }}" --date "${{ needs.prepare.outputs.committee_date }}"
          python _system/scripts/investment_committee_pipeline.py assemble "${{ needs.prepare.outputs.ticker }}" --date "${{ needs.prepare.outputs.committee_date }}"
          python _system/scripts/refresh_valuation_dashboard_rows.py --tickers "${{ needs.prepare.outputs.ticker }}"
          # Same reason as power-zone-universe.yml: this job refreshes rows but
          # never runs build_dashboard_data.py, so the gitignored
          # dashboard_data.json intermediate does not exist here. Validate the
          # committed core.json the SPA boots from. ls-algo-universe.yml
          # deliberately does NOT set this -- it rebuilds the monolith first,
          # so an absent one there is a real error.
          CI_PAGES_DEPLOY_ONLY=1 python _system/scripts/validate_dashboard_data.py
      - name: Commit assembled committee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${{ needs.prepare.outputs.ticker }}/research/committee_${{ needs.prepare.outputs.committee_date }}"*.json
          # dashboard_data.json is not listed here: gitignored since the
          # 2026-08-11 monolith cleanup, so it can never be committed, and
          # `git add` on a pathspec matching nothing exits 128 rather than
          # doing nothing. Same fix as power-zone-universe.yml.
          git add "${{ needs.prepare.outputs.ticker }}/research/committee_work/${{ needs.prepare.outputs.committee_date }}/manifest.json" \
                  "${{ needs.prepare.outputs.ticker }}/research/valuation_workbench.json"
          git commit -m "feat(ic): assemble ${{ needs.prepare.outputs.ticker }} committee ${{ needs.prepare.outputs.committee_date }}"
          git push origin HEAD:main
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=advance-investment-committee

  refresh-stale-packet:
    needs: prepare
    # Same switch that gates agent execution: no voters, no re-freezing.
    if: needs.prepare.outputs.action == 'refresh' && vars.COMMITTEE_AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            _system
            ${{ needs.prepare.outputs.ticker }}/research
      - name: Preserve stale packet and initialize current evidence
        run: |
          python _system/scripts/select_committee_work.py \
            --refresh-ticker "${{ needs.prepare.outputs.ticker }}" \
            --refresh-date "${{ needs.prepare.outputs.committee_date }}"
      - name: Commit refreshed committee packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${{ needs.prepare.outputs.ticker }}/research/committee_work"
          if [ -f _system/data/committee_triage.json ]; then
            git add -- _system/data/committee_triage.json
          fi
          git commit -m "chore(ic): re-freeze or park ${{ needs.prepare.outputs.ticker }} committee packet"
          git push origin HEAD:main
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=advance-investment-committee

  caught-up:
    needs: prepare
    if: needs.prepare.outputs.action == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "No committee stage is ready; the automatic queue is caught up."

  waiting-for-prs:
    needs: prepare
    if: needs.prepare.outputs.action == 'waiting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All missing committee tasks already have open PRs; no duplicate calls admitted."
