name: Auto - Agent PR Merge

# Squash-merge Cursor cloud-agent PRs (Marvin research or Investment Committee
# task artifacts) after research-quality CI passes. Resolves shared-file
# conflicts with main before merge when needed.
#
# Consistency guardrails:
# 1. Wait for the Research quality workflow run (does not fail if checks have
#    not appeared yet). Also re-trigger when that workflow completes.
# 2. Serialize squash merges with a global concurrency group so parallel agent
#    PRs do not race conflict resolution against main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: ["Research quality"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  resolve-pr:
    if: >
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
      eligible: ${{ steps.pr.outputs.eligible }}
      lane: ${{ steps.pr.outputs.lane }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_draft: ${{ steps.pr.outputs.is_draft }}
    steps:
      - name: Resolve PR number and eligibility
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR="$PR_NUMBER"
          else
            PR=$(gh api "repos/${REPO}/commits/${RUN_SHA}/pulls" \
              -H "Accept: application/vnd.github.groot-preview+json" \
              --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "No open PR for workflow_run SHA ${RUN_SHA}; skipping."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "number=" >> "$GITHUB_OUTPUT"
              echo "head_ref=" >> "$GITHUB_OUTPUT"
              echo "head_sha=" >> "$GITHUB_OUTPUT"
              echo "is_draft=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          HEAD_REF=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName')
          IS_DRAFT=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR state=$STATE — skipping automerge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Two automerge lanes. cursor/* carries research/committee artifacts
          # and goes through the provenance gate; codex/* and claude/* are
          # code-agent PRs and gate purely on every CI check being green.
          if [[ "$HEAD_REF" =~ ^cursor/ ]]; then
            LANE="research"
          elif [[ "$HEAD_REF" =~ ^(codex|claude)/ ]]; then
            LANE="code"
          else
            echo "PR #$PR head ref '$HEAD_REF' is not an agent branch (cursor/, codex/, claude/) — skipping automerge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "lane=none" >> "$GITHUB_OUTPUT"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.eligible == 'true' && needs.resolve-pr.outputs.lane == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: agent-automerge-gate-${{ needs.resolve-pr.outputs.number }}
      cancel-in-progress: true
    outputs:
      number: ${{ needs.resolve-pr.outputs.number }}
      head_ref: ${{ needs.resolve-pr.outputs.head_ref }}
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Mark draft PR ready (Cursor cloud agent opens drafts)
        if: needs.resolve-pr.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ needs.resolve-pr.outputs.number }}" \
            --repo "${{ github.repository }}"

      - name: Confirm PR is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ needs.resolve-pr.outputs.number }}"
          sleep 3
          IS_DRAFT=$(gh pr view "$PR" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::PR #$PR is still a draft after ready promotion."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable agent provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.resolve-pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ needs.resolve-pr.outputs.head_ref }}
        run: |
          mapfile -t FILES < <(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          mapfile -t RESEARCH_TICKERS < <(printf '%s\n' "${FILES[@]}" | sed -nE 's|^([^/]+)/research/research_agent_manifest\.json$|\1|p' | sort -u)
          mapfile -t COMMITTEE_FILES < <(printf '%s\n' "${FILES[@]}" | grep -E '^[^/]+/research/committee_work/' || true)

          if [ "${#RESEARCH_TICKERS[@]}" -gt 0 ]; then
            for TICKER in "${RESEARCH_TICKERS[@]}"; do
              MANIFEST="$(mktemp)"
              STATE="$(mktemp)"
              gh api "repos/$REPO/contents/$TICKER/research/research_agent_manifest.json?ref=$HEAD_REF" --jq .content | base64 --decode > "$MANIFEST"
              gh api "repos/$REPO/contents/$TICKER/research/agent_run_state.json?ref=$HEAD_REF" --jq .content | base64 --decode > "$STATE"
              python _system/scripts/validate_research_pr_provenance.py --ticker "$TICKER" --manifest "$MANIFEST" --state "$STATE"
            done
            exit 0
          fi

          if [ "${#COMMITTEE_FILES[@]}" -eq 0 ]; then
            echo "::error::Cursor agent PR must include research_agent_manifest.json or committee_work artifacts."
            exit 1
          fi

          # Workspace is the PR merge commit: main packet + this task's artifact.
          printf '%s\n' "${COMMITTEE_FILES[@]}" | python _system/scripts/validate_committee_pr_artifacts.py

      - name: Refresh head SHA
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh pr view "${{ needs.resolve-pr.outputs.number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for Research quality workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python _system/scripts/wait_for_workflow_run.py \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.head.outputs.sha }}" \
            --workflow "Research quality" \
            --timeout-seconds 2700 \
            --poll-seconds 15

  code-gate:
    # codex/* and claude/* PRs carry code, not research artifacts, so their
    # bar is simpler and stricter in a different direction: EVERY check on the
    # head SHA must complete green. Nothing here bypasses a red check — a
    # failing CI keeps the PR open and the notify job says so on the PR.
    needs: resolve-pr
    if: needs.resolve-pr.outputs.eligible == 'true' && needs.resolve-pr.outputs.lane == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: agent-automerge-gate-${{ needs.resolve-pr.outputs.number }}
      cancel-in-progress: true
    steps:
      - name: Mark draft PR ready
        if: needs.resolve-pr.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ needs.resolve-pr.outputs.number }}"             --repo "${{ github.repository }}" || true

      - name: Wait for every check on the head SHA to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve-pr.outputs.number }}
        run: |
          set -euo pipefail
          # Jobs belonging to this workflow must not gate themselves.
          OWN='^(resolve-pr|gate|code-gate|merge|notify|Resolve PR number and eligibility)$'
          DEADLINE=$(( $(date +%s) + 2700 ))
          while :; do
            SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
            RUNS=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv')
            TOTAL=0; PENDING=0; FAILED=""
            while IFS=$'	' read -r NAME STATUS CONCLUSION; do
              [ -z "$NAME" ] && continue
              if echo "$NAME" | grep -qE "$OWN"; then continue; fi
              TOTAL=$((TOTAL+1))
              if [ "$STATUS" != "completed" ]; then PENDING=$((PENDING+1)); continue; fi
              case "$CONCLUSION" in
                success|neutral|skipped) ;;
                *) FAILED="$FAILED $NAME($CONCLUSION)" ;;
              esac
            done <<< "$RUNS"
            if [ -n "$FAILED" ]; then
              echo "::error::PR #$PR blocked: failing checks:$FAILED"
              exit 1
            fi
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "All $TOTAL checks green for $SHA."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::PR #$PR blocked: checks still pending after 45m (total=$TOTAL pending=$PENDING)."
              exit 1
            fi
            echo "checks total=$TOTAL pending=$PENDING — waiting..."
            sleep 20
          done

  merge:
    needs: [resolve-pr, gate, code-gate]
    # Exactly one lane gate runs per PR; merge when that one succeeded.
    if: >-
      !cancelled() &&
      (needs.gate.result == 'success' || needs.code-gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize squash merges across all agent PRs to avoid main-tip races.
    concurrency:
      group: agent-automerge-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if already merged
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ needs.resolve-pr.outputs.number }}"
          STATE=$(gh pr view "$PR" --repo "${{ github.repository }}" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR already $STATE; nothing to merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge=true" >> "$GITHUB_OUTPUT"

      - name: Resolve merge conflicts with main
        if: steps.state.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ needs.resolve-pr.outputs.number }}"
          MERGEABLE=$(gh pr view "$PR" --repo "${{ github.repository }}" --json mergeable -q .mergeable)
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            if [ "${{ needs.resolve-pr.outputs.lane }}" = "research" ]; then
              python _system/scripts/resolve_marvin_pr_conflicts.py "$PR"
            else
              echo "::error::Code-lane PR #$PR conflicts with main; automerge never auto-resolves code conflicts. Rebase the branch."
              exit 1
            fi
          fi

      - name: Ensure mergeable before squash
        if: steps.state.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ needs.resolve-pr.outputs.number }}"
          REPO="${{ github.repository }}"
          for attempt in 1 2 3 4 5; do
            MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q .mergeable)
            if [ "$MERGEABLE" = "MERGEABLE" ]; then
              exit 0
            fi
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              if [ "${{ needs.resolve-pr.outputs.lane }}" != "research" ]; then
                echo "::error::Code-lane PR #$PR conflicts with main; rebase required."
                exit 1
              fi
              python _system/scripts/resolve_marvin_pr_conflicts.py "$PR"
              sleep 10
            else
              sleep 5
            fi
          done
          MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q .mergeable)
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "::error::PR #$PR still not mergeable ($MERGEABLE) after retries."
            exit 1
          fi

      - name: Squash merge and delete branch
        if: steps.state.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ needs.resolve-pr.outputs.number }}"
          REPO="${{ github.repository }}"
          HEAD_REF="${{ needs.resolve-pr.outputs.head_ref }}"

          gh api --method PUT "repos/${REPO}/pulls/${PR}/merge" \
            -f merge_method=squash

          gh api --method DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" \
            || echo "Branch ${HEAD_REF} already deleted."

      - name: Summary
        if: steps.state.outputs.merge == 'true'
        run: |
          echo "Merged PR #${{ needs.resolve-pr.outputs.number }} (${{ needs.resolve-pr.outputs.head_ref }}) into main."

      - name: Advance any committee task merged by this PR
        if: steps.state.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=advance-investment-committee

  notify:
    # A blocked automerge used to be silent — six green-looking PRs sat open
    # for days because their Research quality CI was red and nothing said so.
    # Post (or update) one marker comment on the PR whenever a lane gate or
    # the merge fails, so the blocking reason is visible on the PR itself.
    needs: [resolve-pr, gate, code-gate, merge]
    if: >-
      !cancelled() &&
      needs.resolve-pr.outputs.eligible == 'true' &&
      (needs.gate.result == 'failure' || needs.code-gate.result == 'failure' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment the blocking reason on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve-pr.outputs.number }}
          LANE: ${{ needs.resolve-pr.outputs.lane }}
          MERGE: ${{ needs.merge.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER="<!-- automerge-blocked -->"
          if [ "$MERGE" = "failure" ]; then
            REASON="the merge step failed (conflict with main, or the squash was rejected)"
          elif [ "$LANE" = "research" ]; then
            REASON="the research gate failed: provenance validation or the Research quality workflow is red"
          else
            REASON="one or more CI checks on the head commit failed or never completed"
          fi
          {
            echo "$MARKER"
            echo "**Automerge is blocked**: ${REASON}."
            echo ""
            echo "Nothing merges while this stands. Fix the cause and push; automerge re-runs on every sync. [Gate run](${RUN_URL})."
          } > body.md
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
          echo "Blocked comment posted on PR #$PR."

