name: Canonical Memory Triage

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit-main
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dispose non-durable proposals and rebuild the human queue
        run: |
          set -euo pipefail
          python _system/scripts/ssi_adjudicate.py queue --limit 20 --write
          python _system/scripts/build_memory_triage.py --migrate-ledger
          python _system/scripts/build_memory_triage.py --auto-dispose-nondurable --by memory-triage-bot
          python _system/scripts/build_memory_triage.py --repair-routes --by memory-triage-bot
          python _system/scripts/deliver_routed_memory.py
          python _system/scripts/build_memory_triage.py
          python _system/scripts/epistemic_loop_controller.py
      - name: Test disposition and projection integrity
        run: |
          set -euo pipefail
          python -m pytest -q _system/scripts/tests/test_memory_triage.py
          python _system/scripts/graph_invariants.py || true
          python _system/scripts/validate_invariant_subset.py E4 E5 E7
      - name: Publish triage summary
        if: always()
        run: |
          {
            echo "### Memory triage"
            echo '```json'
            cat _system/reviews/pending/memory_triage_summary.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit disposition truth, queue, and loop status
        uses: ./.github/actions/commit-main
        with:
          message: "chore(memory): daily canonical triage and routing"
          git_add: >-
            _system/memory/triage_events.jsonl
            _system/memory/triage_ledger.json
            _system/memory/routed_observations.jsonl
            _system/reviews/pending/memory_triage.md
            _system/reviews/pending/memory_triage_summary.json
            _eval/ssi_adjudication_queue.json
            _system/research/epistemic_loop_status.json
            _system/data/epistemic_work_queue.json
            _system/data/falsifier_authoring_queue.json
            _system/data/runs/epistemic_loop
