name: Memory Triage

# Weekly knowledge-compounding sweep: aggregate unpromoted [PROPOSED ...]
# bullets from daily logs plus corrections into one pending review so the
# human filter promotes learning instead of letting it pile up. The script
# never writes MEMORY.md (human-quality-filter rule).
on:
  schedule:
    # Sunday 14:00 UTC — clear of the 06:00 activist job, the 10:00 full
    # downloads run, and the 16:00 letter backfill.
    - cron: "0 14 * * 0"

permissions:
  contents: write

concurrency:
  group: data-commit-main
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/memory
            _system/reviews
            _system/research/falsifier_outcomes.jsonl
            _system/research/falsifier_calibration.json
            _system/research/committee_outcomes.jsonl
            _system/research/committee_calibration.json
            _system/scripts/build_memory_triage.py
            _system/scripts/ssi_adjudicate.py
            _system/scripts/calibrate_ssi.py
            _eval
            */research/falsifier_specs.json
            */research/committee_*.json
            */research/human_decision.json
            */research/evidence/ssi_verified_claims_*.json
            _system/scripts/ci_push_main.sh
            .github/actions/commit-main
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical memory triage and learning-loop summary
        run: |
          python _system/scripts/ssi_adjudicate.py queue --limit 20 --write
          python _system/scripts/build_memory_triage.py

      - name: Commit pending review digest
        uses: ./.github/actions/commit-main
        with:
          message: |
            Weekly canonical memory triage for human review.

            Refresh the disposition-backed proposal queue and epistemic-loop
            summary (build_memory_triage.py).
          git_add: _system/reviews/pending/memory_triage.md _system/reviews/pending/memory_triage_summary.json _eval/ssi_adjudication_queue.json
