name: Podcast Refresh

# The podcast pipeline had no scheduler of any kind. `podcast_cloud_refresh.py`
# was written to be run on a cadence, PODCAST.md documents it as the entry
# point, and it was invoked by hand exactly once -- commit eac90f82d78 on
# 2026-07-28 -- after which the catalog sat frozen at 3,561 episodes while the
# dashboard went on presenting it as current. Nothing detected that: the shard
# carried no timestamp, so it was not registered as a P6 data feed and could
# not go stale. Both halves are fixed together; a cron with no staleness check
# fails silently the first time the job errors, and a staleness check with no
# cron just reports the same violation forever.

on:
  # Weekly, Monday 21:00 UTC. The upstream shows publish on their own
  # schedules through the week and the fetch is rate-limited against iTunes and
  # the Podcast Index, so a daily run would spend most of its budget
  # re-discovering episodes it already has.
  #
  # Moved off 07:00 after the only scheduled run this workflow ever had --
  # 32007940562 on 2026-08-17 -- was cancelled while queued with
  # "Canceling since a higher priority waiting request for data-commit-main
  # exists". Monday 07:00 lands in the middle of the morning writer pile-up
  # (power-zone 05:30 Mon, data-pipeline activist 06:00 daily, portfolio news
  # 06:30), so the job spent 55 minutes pending and was then evicted from the
  # single pending slot that group allows. 21:00 UTC is empty in every other
  # workflow's schedule. The concurrency change below is the real fix; this is
  # belt-and-braces so the fetch also is not competing for runners.
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Full harvest (all-watchlist discover, published-first fetch, Whisper backlog)"
        type: boolean
        default: false
      whisper_batch:
        description: "Whisper backlog items to drain after fetch (0 to skip)"
        type: string
        default: "20"

# Whisper backlog, measured 2026-08-11: 1,563 episodes have no text transcript
# and need audio transcription. Draining 20 a week never finishes it -- that is
# 78 weeks, and the backlog grows as shows publish. Treat the two as separate
# problems: this cron keeps the catalog CURRENT (new episodes, text transcripts
# where the show publishes them), and the historical audio gap needs either a
# dedicated long-running backfill (`--backfill`, run manually off-CI where a
# 120-minute job limit does not apply) or a paid transcription API. Raising
# whisper_batch here just makes the weekly job time out and land nothing.

permissions:
  contents: write

concurrency:
  group: podcast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The weekly run finishes well inside an hour. A dispatched --backfill does
    # not: run 32280009523 was still in the fetch at 1h52m and was killed by the
    # old 120-minute cap before the commit step, landing nothing after two hours
    # of work. GitHub's hosted-runner ceiling is 6 hours, so give the backfill
    # room to reach its commit rather than discovering the cap the hard way.
    # This is a ceiling, not a target -- a weekly run that approaches it is a
    # signal that discovery is looping, not that the cap is too low.
    timeout-minutes: 350
    # Deliberately NOT in data-commit-main. A concurrency group holds one
    # running slot and one pending slot; a third request evicts whatever is
    # pending. Nine workflows share data-commit-main, so a weekly job that
    # queues behind the daily writers gets cancelled before it runs a single
    # step -- which is exactly what happened to run 32007940562, and why the
    # catalog has been frozen at 2026-08-11 with nothing reporting a failure.
    #
    # Serialization at the push layer is what actually protects main, and it
    # already exists: _system/scripts/ci_push_main.sh rebases onto origin/main
    # with five attempts and regenerates conflicting derived artifacts
    # (dashboard/data/*.json is on its regenerable list). A concurrent writer
    # produces a rebase, not a lost commit. The workflow-level podcast-refresh
    # group below still prevents two podcast runs from overlapping each other,
    # which is the only overlap this job actually needs to prevent.
    env:
      # Discovery falls back to iTunes search when these are absent, so a
      # missing secret degrades coverage rather than failing the lane. Both
      # spellings are read by discover_podcasts.py; set whichever exists.
      PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
      PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
      PODCAST_INDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
      PODCAST_INDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
      # The transcript corpus lives in the private research vault, not in this
      # repo. Without these, vault_paths.podcasts_root() finds no vault and
      # falls back to the in-repo legacy path, which does not exist -- so the
      # run starts from an EMPTY corpus and re-harvests all ~3,600 episodes
      # from the internet on every execution. That is what made run
      # 32280009523 take two hours and still only reach 3,430 episodes and
      # 1,746 transcripts against the 3,601 / 2,075 the vault actually holds.
      # A single pass cannot reproduce an accumulated corpus, so the catalog
      # comes out smaller and the "catalog shrank" guard correctly rejects it.
      RESEARCH_VAULT_REPO_URL: ${{ secrets.RESEARCH_VAULT_REPO_URL }}
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      RESEARCH_VAULT_ROOT: _external/research-vault

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Checkout workspace (full)
        run: bash _system/scripts/ci_checkout_workspace.sh full

      # Must come before any pipeline step. Every episode, transcript and
      # .meta.json the builders read lives here; without it the corpus is
      # empty and the run silently rebuilds a worse catalog than the one it
      # replaces. ci_checkout_workspace.sh does not clone the vault.
      - name: Checkout research vault
        uses: ./.github/actions/checkout-vault

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install transcript dependencies
        run: pip install -r _system/scripts/requirements-transcripts.txt

      - name: Check Podcast Index credentials are present
        # discover_podcasts.podcast_index_auth_headers() returns None when either
        # half is missing and the caller silently falls back to iTunes search,
        # which caps at 1000 items per feed. That degradation is invisible in a
        # scheduled run: the job still exits 0 and still commits, just with a
        # truncated back catalog. Both halves are needed -- the Authorization
        # header is sha1(key + secret + timestamp), so a present key with a
        # missing secret authenticates as nothing.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PODCASTINDEX_API_KEY:-}" ] || [ -z "${PODCASTINDEX_API_SECRET:-}" ]; then
            echo "::warning title=Podcast Index credentials missing::Discovery will fall back to iTunes search and cap capped feeds at 1000 items. Set PODCASTINDEX_API_KEY and PODCASTINDEX_API_SECRET as repo secrets."
          else
            python - <<'PY'
          import sys
          sys.path.insert(0, "_system/scripts")
          from discover_podcasts import podcast_index_auth_headers
          h = podcast_index_auth_headers()
          if not h:
              raise SystemExit("::error::credentials are set in the environment but the auth header could not be built")
          print(f"Podcast Index auth headers built: {sorted(h)}")
          PY
          fi

      - name: Check the transcript corpus is actually present
        # The failure this catches is silent by construction: with no vault,
        # podcasts_root() returns a legacy in-repo path, the builders find zero
        # .meta.json files, and the pipeline happily rebuilds a smaller catalog.
        # The downstream "catalog shrank" guard would stop the commit, but only
        # after burning hours re-harvesting. Fail here instead, in seconds.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, sys
          sys.path.insert(0, "_system/scripts")
          from vault_paths import podcasts_root

          root = podcasts_root(create=False)
          episodes = len(glob.glob(str(root / "episodes" / "**" / "*.meta.json"), recursive=True)) if root else 0
          committed = json.load(open("dashboard/data/insights/podcasts.json", encoding="utf-8"))
          expected = len(committed.get("podcast_index") or [])
          print(f"corpus root      : {root}")
          print(f"corpus episodes  : {episodes}")
          print(f"committed catalog: {expected}")

          if episodes == 0:
              sys.exit(
                  "::error::The transcript corpus is empty. RESEARCH_VAULT_CLONE_TOKEN is probably "
                  "missing, so the vault was not cloned and this run would re-harvest from scratch "
                  "and publish a smaller catalog than the one it replaces."
              )
          # Discovery legitimately adds episodes between runs, and a few may be
          # pruned upstream, so allow a small shortfall but not a cliff.
          if episodes < expected * 0.95:
              sys.exit(
                  f"::error::Corpus holds {episodes} episodes against a committed catalog of "
                  f"{expected}. The vault looks partial; refusing to rebuild from it."
              )
          PY

      - name: Record the pre-run catalog state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("dashboard/data/insights/podcasts.json")
          doc = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          rows = doc.get("podcast_index") or []
          dates = sorted(r.get("published") or "" for r in rows if r.get("published"))
          print(f"episodes={len(rows)}")
          print(f"newest={dates[-1] if dates else 'none'}")
          PY

      - name: Refresh podcast catalog
        shell: bash
        env:
          BACKFILL: ${{ inputs.backfill }}
          WHISPER_BATCH: ${{ inputs.whisper_batch || '20' }}
        run: |
          set -euo pipefail
          args=(--date "$(date -u +%Y-%m-%d)" --whisper-batch "${WHISPER_BATCH}")
          if [ "${BACKFILL}" = "true" ]; then
            args+=(--backfill)
          fi
          python _system/scripts/podcast_cloud_refresh.py "${args[@]}"

      - name: Verify the catalog actually moved
        shell: bash
        env:
          BEFORE_EPISODES: ${{ steps.before.outputs.episodes }}
          BEFORE_NEWEST: ${{ steps.before.outputs.newest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path("dashboard/data/insights/podcasts.json")
          if not path.exists():
              sys.exit("podcasts.json was not written; the refresh did not complete")
          doc = json.loads(path.read_text(encoding="utf-8"))
          rows = doc.get("podcast_index") or []
          dates = sorted(r.get("published") or "" for r in rows if r.get("published"))
          newest = dates[-1] if dates else "none"
          before_n = int(os.environ.get("BEFORE_EPISODES") or 0)
          before_newest = os.environ.get("BEFORE_NEWEST") or "none"
          stamp = doc.get("generated_at")

          print(f"episodes {before_n} -> {len(rows)}")
          print(f"newest   {before_newest} -> {newest}")
          print(f"generated_at {stamp}")

          # A run that exits 0 having written nothing is the exact failure this
          # workflow exists to catch: the last one did that for fourteen days
          # by not existing at all. An unstamped shard is equally bad -- P6
          # cannot age a feed that carries no date, so it would silently pass.
          if not stamp:
              sys.exit("podcasts.json carries no generated_at; P6 cannot age it")
          when = datetime.fromisoformat(str(stamp).replace("Z", "+00:00"))
          if when.tzinfo is None:
              when = when.replace(tzinfo=timezone.utc)
          if datetime.now(timezone.utc) - when > timedelta(hours=6):
              sys.exit(f"generated_at {stamp} was not refreshed by this run")

          # Episode counts legitimately stay flat in a quiet week, so a flat
          # count is a warning, not a failure. Going BACKWARDS is not.
          if len(rows) < before_n:
              sys.exit(f"catalog shrank: {before_n} -> {len(rows)} episodes")
          if len(rows) == before_n:
              print("::warning::No new episodes discovered this run.")
          PY

      # Must run before the catalog is committed. The corpus is the input the
      # catalog is derived from, so publishing a catalog that references
      # episodes the vault does not have arms a failure for the next run:
      # that run clones the smaller vault, rebuilds a smaller catalog, and
      # trips the "catalog shrank" guard. Run 32296236096 fetched 110 new
      # episodes into the runner's clone and threw them away, leaving the
      # catalog at 3,711 against a vault of 3,601.
      #
      # Pushing also stops every run re-fetching the same episodes against
      # rate-limited upstreams, which is most of what makes the job slow.
      - name: Push new transcripts back to the research vault
        shell: bash
        working-directory: _external/research-vault
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Corpus only. Other vault trees belong to other lanes.
          git add podcasts
          if git diff --cached --quiet; then
            echo "No new corpus files this run."
            exit 0
          fi
          echo "Corpus changes:"
          git diff --cached --stat | tail -5
          git commit -q -m "chore(podcasts): corpus refresh $(date -u +%Y-%m-%d)"
          # The vault takes writes from several lanes, so rebase rather than
          # assume a fast-forward.
          for attempt in 1 2 3; do
            git fetch origin main -q
            if git rebase origin/main -q && git push origin HEAD:main -q; then
              echo "Pushed corpus to research-vault (attempt $attempt)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          # The catalog step still runs: a failed corpus push is worth a warning,
          # not a lost refresh. The next run re-fetches what did not land.
          echo "::warning title=Vault push failed::New transcripts were not pushed to research-vault; the next run will re-fetch them."

      - name: Commit podcast catalog
        uses: ./.github/actions/commit-main
        with:
          message: "chore(podcasts): weekly catalog refresh $(date -u +%Y-%m-%d)"
