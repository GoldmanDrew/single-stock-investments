name: Power Zone Universe

on:
  push:
    branches: [main]
    paths:
      - "*/research/valuation.json"
      - "*/research/evidence_refresh.json"
      - "*/research/evidence/*.json"
      - "_system/scripts/calculation_proof.py"
      - "_system/scripts/universal_valuation_contract.py"
      - "_system/scripts/build_valuation_universe_tiers.py"
      - "_system/reference/valuation_method_registry.json"
      - "_system/portfolio/valuation_universe_policy.json"
      - "_system/templates/*valuation*schema.json"
  schedule:
    - cron: "30 5 * * 1"
  workflow_run:
    workflows: [Data Pipeline]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [refresh-power-zones]

permissions:
  contents: write
  actions: read

concurrency:
  group: data-commit-main
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      downloads_ready: ${{ steps.check.outputs.downloads_ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name=="downloads") | .conclusion' 2>/dev/null || true)
          if echo "$JOBS" | grep -qx success; then
            echo "downloads_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "downloads_ready=false" >> "$GITHUB_OUTPUT"
          fi

  route-value-gate:
    needs: gate
    if: always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && needs.gate.outputs.downloads_ready == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/**
            /.github/workflows/**
            /_system/**
            /dashboard/**
            /*/research/**

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate cutover pipeline
        working-directory: _system/scripts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-governance.txt
          python -m unittest \
            test_calculation_proof \
            test_valuation_library_index \
            test_generalized_valuation_system \
            test_investment_committee_pipeline \
            test_valuation_workbench \
            test_power_zone_pricing \
            test_decision_authority \
            test_dashboard_valuation_publishing \
            test_build_dashboard_shards \
            test_build_valuation_universe_tiers \
            test_refresh_valuation_dashboard_rows \
            test_security_decision_pipeline \
            test_human_decision \
            test_valuation_authority_cutover \
            test_llm_call_gate \
            test_agent_evidence_gates \
            test_evidence_recovery \
            test_committee_task_queue \
            test_llm_workflow_governance
          python build_valuation_method_registry.py --check

      # persona_lens.py had ZERO CI invokers before 2026-08-11, so lenses.json
      # went stale the moment anything but a full local marvin refresh rewrote
      # valuation.json, and the nightly dashboard rebuilds (data-pipeline
      # lanes run build_dashboard_data.py, the sole lens consumer) baked the
      # stale committed file (invariant L3). Regenerating and COMMITTING
      # lenses.json here, right after the valuations move, is what keeps
      # those rebuilds fresh. --skip-valuation keeps CI from rewriting
      # valuation.json (no self-trigger risk; the embedded lens_consensus
      # block is refreshed by full marvin runs instead).
      - name: Process canonical universe
        run: |
          python _system/scripts/build_valuation_method_registry.py
          python _system/scripts/run_security_decision_pipeline.py --scope all --skip-dashboard
          python _system/scripts/persona_lens.py --all --skip-valuation
          python _system/scripts/refresh_valuation_dashboard_rows.py
          # dashboard_data.json is a gitignored build intermediate (removed
          # 2026-08-11 with the 149MB monolith cleanup). This job runs the
          # pipeline with --skip-dashboard, so it never rebuilds that file and
          # must not demand it: validate the committed core.json the SPA
          # actually boots from instead.
          #
          # Without this the job passes on workflow_run -- an upstream rebuild
          # leaves a monolith behind in the runner -- and fails on a bare push,
          # where nothing creates one. That asymmetry is what broke the deploy
          # chain: Power Zone failing skips the dashboard build entirely and
          # the site silently keeps serving the previous artifacts.
          CI_PAGES_DEPLOY_ONLY=1 python _system/scripts/validate_dashboard_data.py

      - name: Commit authority artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*/research/valuation_route.json' \
                         '*/research/valuation_contract.json' \
                         '*/research/valuation_workbench.json' \
                         '*/research/pricing_analysis.json' \
                         '*/research/lenses.json' \
                         '_system/lenses/universe_percentiles.json' \
                         '_system/data/valuation_universe_tiers.json' \
                         '_system/data/runs/power_zone_universe_run_*.json' \
                         dashboard/data/valuation_method_registry.json \
                         dashboard/data/power_zones.json \
                         dashboard/data/core.json \
                         dashboard/data/tickers
          # dashboard_data.json is deliberately absent from that list. It has
          # been gitignored since the 2026-08-11 monolith cleanup, so it can
          # never be committed -- but `git add` on a pathspec matching nothing
          # is fatal, not a no-op, and this job runs --skip-dashboard so nothing
          # creates it. That is the same asymmetry the validation step above
          # documents: on workflow_run an upstream rebuild leaves a monolith in
          # the runner and the add succeeds, while a bare push or dispatch has
          # no monolith and the step dies with exit 128. The step above was
          # fixed for it in August; this one was missed.
          while IFS= read -r -d '' path; do
            git add -A -- "$path"
          done < <(find . -mindepth 3 -maxdepth 3 -type d -path './*/research/committee_work' -print0)
          if git diff --cached --quiet; then
            echo "No authority artifacts changed."
            exit 0
          fi
          bash _system/scripts/ci_push_main.sh "chore(valuation): process Power Zone universe"

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Power Zone universe processing completed for all companies."
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=advance-investment-committee
