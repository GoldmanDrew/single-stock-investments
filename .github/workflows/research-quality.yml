name: Research quality

on:
  # The SSI pipeline and fact-ledger currency jobs are self-contained and must
  # also validate direct pushes to main, which bypass pull_request entirely --
  # and batch valuation writes land on main by direct push, which is exactly how
  # a mislabeled-currency fact would arrive. The other jobs in this file need a
  # PR base ref and stay gated to pull_request below.
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-quality.yml"
      - "**/research/valuation.json"
      - "**/research/valuation_fact_ledger.json"
      - "_system/scripts/scan_fact_ledger_currency.py"
      - "_system/scripts/test_scan_fact_ledger_currency.py"
      - "_system/scripts/build_ssi_evidence_pack.py"
      - "_system/scripts/build_ssi_claims.py"
      - "_system/scripts/verify_ssi_claims.py"
      - "_system/scripts/build_ssi_report.py"
      - "_system/scripts/run_ssi_pipeline.py"
      - "_system/scripts/calibrate_ssi.py"
      - "_system/scripts/ssi_coverage_report.py"
      - "_system/scripts/build_filing_evidence.py"
      - "_system/scripts/tests/test_ssi_pipeline_v2.py"
      - "_eval/**"
      - "_system/graph/**"
      - "_system/scripts/graph_build.py"
      - "_system/scripts/graph_query.py"
      - "_system/scripts/graph_invariants.py"
      - "_system/scripts/test_graph_build.py"
      - "_system/scripts/test_graph_invariants.py"
      - "_system/scripts/check_evidence_integrity.py"
      - "_system/scripts/test_check_evidence_integrity.py"
      - "_system/data/evidence_integrity_baseline.json"
      - "_system/memory/**"
      # Judged surfaces of the graph invariants: contracts and typed
      # falsifier sidecars feed E1/E2, _system/research holds outcomes and
      # calibration (E2/E3), run receipts feed P4, and review artifacts are
      # part of P4's scan surface. Without these a push that only changes a
      # judged surface never triggers the suite.
      - "**/research/valuation_contract.json"
      - "**/research/falsifier_specs.json"
      - "_system/research/**"
      - "_system/data/runs/**"
      - "_system/reviews/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/research-quality.yml"
      - "**/research/**"
      - "_system/scripts/ci_checkout_workspace.sh"
      - "_system/scripts/ci_resolve_checkout_ref.sh"
      - "_system/scripts/ci_sparse_checkout_paths.py"
      - "_system/scripts/lint_deep_dive.py"
      - "_system/scripts/lint_adversarial.py"
      - "_system/scripts/lint_pr_research.py"
      - "_system/scripts/check_evidence_completeness.py"
      - "_system/scripts/refresh_optionality_valuation.py"
      - "_system/scripts/filing_facts.py"
      - "_system/prompts/cloud_marvin_runbook.md"
      - "_system/scripts/marvin_deep_dive.mjs"
      - "_system/scripts/marvin_cloud_refresh.py"
      - "_system/scripts/batch_portfolio_refresh.py"
      - "_system/scripts/check_cloud_marvin_sync.py"
      - "_system/scripts/build_insights.py"
      - "_system/scripts/validate_dashboard_data.py"
      - "_system/scripts/ci_push_main.sh"
      - "dashboard/data/insights.json"
      - "_system/scripts/build_ssi_evidence_pack.py"
      - "_system/scripts/build_ssi_claims.py"
      - "_system/scripts/verify_ssi_claims.py"
      - "_system/scripts/build_ssi_report.py"
      - "_system/scripts/run_ssi_pipeline.py"
      - "_system/scripts/calibrate_ssi.py"
      - "_system/scripts/ssi_coverage_report.py"
      - "_system/scripts/build_filing_evidence.py"
      - "_system/scripts/scan_fact_ledger_currency.py"
      - "_system/scripts/test_scan_fact_ledger_currency.py"
      - "_eval/**"
      - "_system/graph/**"
      - "_system/scripts/graph_build.py"
      - "_system/scripts/graph_query.py"
      - "_system/scripts/graph_invariants.py"
      - "_system/scripts/test_graph_build.py"
      - "_system/scripts/test_graph_invariants.py"
      - "_system/scripts/check_evidence_integrity.py"
      - "_system/scripts/test_check_evidence_integrity.py"
      - "_system/data/evidence_integrity_baseline.json"
      - "_system/memory/**"
      # Graph-invariant judged surfaces not already covered by the
      # "**/research/**" pattern above (which subsumes valuation_contract,
      # falsifier_specs, and _system/research): run receipts (P4) and the
      # review tree P4 scans.
      - "_system/data/runs/**"
      - "_system/reviews/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # On push there is no PR number; keying on the sha gives each push its own
  # group so frequent automated commits to main don't cancel each other's run.
  group: research-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prompt_sync: ${{ steps.classify.outputs.prompt_sync }}
      research_lint: ${{ steps.classify.outputs.research_lint }}
      dashboard_integrity: ${{ steps.classify.outputs.dashboard_integrity }}
      ssi_pipeline: ${{ steps.classify.outputs.ssi_pipeline }}
      fact_currency: ${{ steps.classify.outputs.fact_currency }}
      graph_invariants: ${{ steps.classify.outputs.graph_invariants }}
    steps:
      - id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const isPush = context.eventName === 'push';
            let names = [];
            if (!isPush) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              names = files.map(file => file.filename);
            }
            // On push we deliberately do not diff before..after: the compare API
            // returns at most 300 files, and a batch push here routinely changes
            // thousands, so a change could be missed. `on.push.paths` lists only
            // the SSI and fact-ledger-currency surfaces, so the workflow having
            // triggered at all is itself the signal -- both of those jobs run on
            // every push that reaches here. Over-running one cheap job beats
            // missing the push that ships a mislabeled-currency fact.
            const has = predicate => names.some(predicate);
            const promptSync = has(name =>
              name === '_system/prompts/cloud_marvin_runbook.md' ||
              name === '_system/scripts/check_cloud_marvin_sync.py' ||
              name === '_system/scripts/marvin_deep_dive.mjs'
            );
            const researchLint = has(name =>
              /(^|\/)research\//.test(name) ||
              [
                '_system/scripts/lint_deep_dive.py',
                '_system/scripts/lint_adversarial.py',
                '_system/scripts/lint_pr_research.py',
                '_system/scripts/check_evidence_completeness.py',
                '_system/scripts/refresh_optionality_valuation.py',
                '_system/scripts/filing_facts.py',
              ].includes(name)
            );
            const dashboardIntegrity = has(name =>
              /(^|\/)research\//.test(name) ||
              [
                '_system/scripts/build_insights.py',
                '_system/scripts/validate_dashboard_data.py',
                '_system/scripts/ci_push_main.sh',
                '_system/scripts/marvin_cloud_refresh.py',
                'dashboard/data/insights.json',
              ].includes(name)
            );
            const ssiPipeline = isPush || has(name =>
              /^_eval\//.test(name) ||
              /^_system\/scripts\/(build_ssi_|verify_ssi_|run_ssi_|calibrate_ssi|ssi_coverage)/.test(name) ||
              name === '_system/scripts/build_filing_evidence.py' ||
              name === '_system/scripts/tests/test_ssi_pipeline_v2.py'
            );
            // Currency labels are asserted in both valuation.json and the fact
            // ledger, and the scanner itself is the only thing that checks them.
            const factCurrency = isPush || has(name =>
              /(^|\/)research\/valuation(_fact_ledger)?\.json$/.test(name) ||
              name === '_system/scripts/scan_fact_ledger_currency.py' ||
              name === '_system/scripts/test_scan_fact_ledger_currency.py'
            );
            // The graph is a projection of contracts, ledgers, memory and CI
            // wiring; the invariant suite is the executable health contract
            // over it (_system/graph/README.md). The judged surfaces --
            // contracts (E1), typed falsifier sidecars (E1/E2), outcomes and
            // calibration under _system/research (E2/E3), run receipts (P4)
            // and the reviews tree P4 scans -- must classify true too, or a
            // PR changing only them skips the suite that judges them.
            const graphInvariants = isPush || has(name =>
              /^_system\/graph\//.test(name) ||
              /^_system\/scripts\/(graph_|test_graph_)[^/]+\.py$/.test(name) ||
              // The evidence-integrity sweep shares this job (same full
              // checkout) and must trigger on its own sources and baseline.
              /^_system\/scripts\/(test_)?check_evidence_integrity\.py$/.test(name) ||
              name === '_system/data/evidence_integrity_baseline.json' ||
              /(^|\/)research\/(valuation_route|valuation_fact_ledger|evidence_task_queue|valuation_automation_state)\.json$/.test(name) ||
              /^_system\/memory\//.test(name) ||
              /(^|\/)research\/(valuation_contract|falsifier_specs)\.json$/.test(name) ||
              /^_system\/research\//.test(name) ||
              /^_system\/data\/runs\//.test(name) ||
              /^_system\/reviews\//.test(name)
            );
            core.setOutput('prompt_sync', String(promptSync));
            core.setOutput('research_lint', String(researchLint));
            core.setOutput('dashboard_integrity', String(dashboardIntegrity));
            core.setOutput('ssi_pipeline', String(ssiPipeline));
            core.setOutput('fact_currency', String(factCurrency));
            core.setOutput('graph_invariants', String(graphInvariants));
            await core.summary
              .addHeading('Research-quality plan')
              .addTable([
                [{data: 'Check', header: true}, {data: 'Runs', header: true}],
                ['cloud-prompt-sync', String(promptSync)],
                ['research-lint', String(researchLint)],
                ['dashboard-integrity', String(dashboardIntegrity)],
                ['ssi-pipeline', String(ssiPipeline)],
                ['fact-ledger-currency', String(factCurrency)],
                ['graph-invariants', String(graphInvariants)],
              ])
              .write();

  cloud-prompt-sync:
    needs: changes
    # PR-only: needs github.base_ref and the PR head ref, neither of
    # which exists on a push event.
    if: github.event_name == 'pull_request' && needs.changes.outputs.prompt_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (minimal)
        run: bash _system/scripts/ci_checkout_workspace.sh minimal "pull/${{ github.event.pull_request.number }}/head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cloud Marvin prompt sync
        run: python _system/scripts/check_cloud_marvin_sync.py

  research-lint:
    needs: changes
    # PR-only: needs github.base_ref and the PR head ref, neither of
    # which exists on a push event.
    if: github.event_name == 'pull_request' && needs.changes.outputs.research_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (PR head + base tip)
        run: |
          # Depth only needs enough history for overlay/insider valuation.json
          # comparisons against base tip. Ticker scope comes from the GitHub PR
          # file list below — never from a shallow two-dot git fallback.
          bash _system/scripts/ci_checkout_workspace.sh history "pull/${{ github.event.pull_request.number }}/head" 2
          git fetch --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export PR changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/pr-files.txt"
          echo "PR files: $(wc -l < "$RUNNER_TEMP/pr-files.txt")"
      - name: Overlay lint scripts from base branch
        run: |
          # Stale PR heads must not break CI when main evolves the lint CLI/API.
          # Pull the full lint dependency set from the base tip, not only the entrypoint.
          set -euo pipefail
          BASE_REF="origin/${{ github.base_ref }}"
          for f in \
            lint_pr_research.py \
            lint_deep_dive.py \
            lint_adversarial.py \
            lint_context_overlay.py \
            lint_insider_signal.py \
            check_evidence_completeness.py \
            marvin_pipeline_common.py \
            filing_facts.py \
            refresh_optionality_valuation.py
          do
            if git cat-file -e "${BASE_REF}:_system/scripts/${f}" 2>/dev/null; then
              git checkout "${BASE_REF}" -- "_system/scripts/${f}"
              echo "overlay _system/scripts/${f} from ${BASE_REF}"
            fi
          done
      - name: Lint changed ticker research
        run: |
          python _system/scripts/lint_pr_research.py \
            --base origin/${{ github.base_ref }} \
            --name-only-file "$RUNNER_TEMP/pr-files.txt"

  ssi-pipeline:
    needs: changes
    if: needs.changes.outputs.ssi_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts
            _eval
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # The job had no install step, so it failed with "No module named pytest"
        # the first time it ever ran. The SSI import chain is otherwise pure
        # stdlib plus repo-local modules; pypdf is only reached through
        # pdf_ocr's function-local import, and pytesseract/pdf2image are guarded
        # by try/except ImportError, so neither is required here.
        run: python -m pip install --disable-pip-version-check pytest pypdf
      - name: SSI pipeline unit tests
        run: |
          python -m pytest -q \
            _system/scripts/tests/test_ssi_evidence_pack.py \
            _system/scripts/tests/test_ssi_claims.py \
            _system/scripts/tests/test_verify_ssi_claims.py \
            _system/scripts/tests/test_ssi_pipeline_v2.py
      - name: Calibration bars (severity-5 recall, locator accuracy, alert precision)
        run: python _system/scripts/calibrate_ssi.py --enforce

  fact-ledger-currency:
    needs: changes
    # Runs on push AND pull_request: the corruption class this catches (a DKK
    # value locked as "USD millions") arrives with batch valuation writes, which
    # go straight to main.
    if: needs.changes.outputs.fact_currency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        # Full tree: the scan resolves each row's `source.ref` to the evidence file
        # it names (`{TICKER}/research/evidence/sec_companyfacts.json`), so a sparse
        # profile would turn real rows into silent "locator does not resolve".
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash _system/scripts/ci_checkout_workspace.sh full "pull/${{ github.event.pull_request.number }}/head"
          else
            bash _system/scripts/ci_checkout_workspace.sh full
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Currency scanner unit tests
        working-directory: _system/scripts
        run: python -m unittest -v test_scan_fact_ledger_currency
      - name: Scan locked currency labels against source unit keys
        # Deliberately no `|| true` and no `continue-on-error`: a mismatch has to
        # fail this job. The repo has a recorded trap where a validator's ERROR
        # only skipped a downstream step, leaving the run green and the data wrong.
        # `pipefail` keeps the scanner's exit code through `tee`.
        run: |
          set -euo pipefail
          python _system/scripts/scan_fact_ledger_currency.py | tee "$RUNNER_TEMP/currency-scan.txt"
      - name: Publish scan output to the run summary
        # always(): the SKIPPED coverage line and any MISMATCH lines must be
        # readable from the run page whether the scan passed or failed.
        if: always()
        run: |
          {
            echo "### Fact-ledger currency scan"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/currency-scan.txt" 2>/dev/null || echo "(no scanner output; the step did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  graph-invariants:
    needs: changes
    # Runs on push AND pull_request: the failure classes this catches (a
    # stalled lane, a guard no CI job invokes, a belief rewritten in place, a
    # receipt in the wrong place) arrive with direct pushes to main just as
    # often as with PRs.
    if: needs.changes.outputs.graph_invariants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (full)
        # Full tree: graph_build streams every ticker's contract and fact
        # ledger, and E5 existence-checks the source paths beliefs cite, so a
        # sparse profile would turn real beliefs into silent "source missing".
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash _system/scripts/ci_checkout_workspace.sh full "pull/${{ github.event.pull_request.number }}/head"
          else
            bash _system/scripts/ci_checkout_workspace.sh full
          fi
      - name: Deepen commit history for lane freshness (commits only, no blobs)
        # graph_build projects Lane/Commit from `git log -n 400`; on the
        # depth-1 checkout above every lane would read NO-COMMIT and fail P3
        # for a reason that has nothing to do with the lanes.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --filter=blob:none --deepen=400 origin "pull/${{ github.event.pull_request.number }}/head"
            # P3 spurious-fire fix: a PR whose branch point is >48h old is
            # missing the nightly lane commits that landed on main since, so
            # every lane would read stale from the PR head's history alone.
            # Fetch a bounded window of main; graph_invariants.py then sets
            # GRAPH_LANE_REF=origin/main so graph_build projects lanes from
            # main whenever that ref exists.
            git fetch --filter=blob:none --depth=300 origin "+refs/heads/main:refs/remotes/origin/main"
          else
            git fetch --filter=blob:none --deepen=400 origin main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Graph engine and invariant unit tests
        working-directory: _system/scripts
        run: python -m unittest -v test_graph_build test_graph_invariants
      - name: Run the invariant suite (hard invariants fail the job)
        # Deliberately no `|| true` and no `continue-on-error`: the repo has a
        # recorded trap where a validator's ERROR only skipped a downstream
        # step, leaving the run green and the data wrong. `pipefail` keeps the
        # suite's exit code through `tee`.
        run: |
          set -euo pipefail
          python _system/scripts/graph_invariants.py | tee "$RUNNER_TEMP/graph-invariants.txt"
      - name: Publish invariant report to the run summary
        # always(): the per-invariant counts and any violation lists must be
        # readable from the run page whether the suite passed or failed.
        if: always()
        run: |
          {
            echo "### Graph invariants"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/graph-invariants.txt" 2>/dev/null || echo "(no invariant output; the step did not run)"
            echo '```'
            echo ""
            cat _system/graph/INVARIANTS.md 2>/dev/null || echo "(INVARIANTS.md was not written)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Evidence integrity unit tests
        working-directory: _system/scripts
        run: python -m unittest -v test_check_evidence_integrity
      - name: Evidence integrity sweep (ratchet; fails only on regression)
        # Shares this job because it needs the same full tree: the sweep reads
        # every ticker's contract, route, ledger, queue and automation state
        # and is meaningless on a sparse checkout.
        #
        # Ratchet, not a hard gate. 124 tickers were trapped when the baseline
        # was recorded; failing the build on that count would freeze the
        # factory, which the graph README already names as the worse failure.
        # `--no-write` keeps CI from dirtying the tree; the counts are
        # compared against _system/data/evidence_integrity_baseline.json and
        # the job fails only when a count rises above its recorded value.
        run: |
          set -euo pipefail
          python _system/scripts/check_evidence_integrity.py --no-write \
            | tee "$RUNNER_TEMP/evidence-integrity.txt"
      - name: Publish evidence integrity report to the run summary
        if: always()
        run: |
          {
            echo "### Evidence integrity"
            echo ""
            cat "$RUNNER_TEMP/evidence-integrity.txt" 2>/dev/null \
              || echo "(no sweep output; the step did not run)"
          } >> "$GITHUB_STEP_SUMMARY"

  dashboard-integrity:
    needs: changes
    # PR-only: needs github.base_ref and the PR head ref, neither of
    # which exists on a push event.
    if: github.event_name == 'pull_request' && needs.changes.outputs.dashboard_integrity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout dashboard validation workspace
        run: bash _system/scripts/ci_checkout_workspace.sh dashboard "pull/${{ github.event.pull_request.number }}/head"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dashboard artifacts and letter corpus
        run: python _system/scripts/validate_dashboard_data.py
