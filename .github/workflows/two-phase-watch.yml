name: Two-phase cooling watch

# Weekly INV Accelsius monitor. Event PDF indexes in Mar/Aug/Oct via --auto-events.
# Does not scrape LinkedIn. Does not edit valuation.json.
#
# Schedule only. `workflow_dispatch` with inputs is what
# test_llm_workflow_governance.test_actions_surface_has_no_manual_run_choices
# forbids -- the manual run *choices* are the thing it guards. This file was
# merged in #907 two days after that test landed, so it has been failing
# `validate` on main ever since, and with it every open research PR.
#
# The IR and news fetches ran on every scheduled run anyway; only the inputs'
# defaults are gone, not the behaviour. If the manual trigger is wanted back,
# the repo's own precedent is to allow-list the file in that test (see
# 74fb49e3721 for darwin-refresh) rather than to keep a red check.

on:
  schedule:
    - cron: "0 17 * * 0"   # Sunday 17:00 UTC, after World Model

permissions:
  contents: write

concurrency:
  group: data-commit-main-two-phase-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout two-phase-watch workspace
        run: bash _system/scripts/ci_checkout_workspace.sh two-phase-watch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile two-phase watch
        run: |
          set -euo pipefail
          python _system/scripts/two_phase_watch.py --auto-events --ir --news
      - name: Commit watch artifacts
        uses: ./.github/actions/commit-main
        with:
          message: "chore: INV two-phase cooling watch $(date -u +%Y-%m-%d)"
          git_add: >-
            INV/research/evidence/
            INV/investor-documents/competitive/
            _system/reviews/pending/INV_two_phase_watch_*.md
            dashboard/data/tickers/INV.json
