[ibkr]
host = "127.0.0.1"
port = 4002
account_alias = "paper-primary"
collector_client_id = 81
bridge_client_id = 91
master_client_id = 90

[ledger]
path = "_private/portfolio-hub/portfolio.db"
backup_dir = "_private/portfolio-hub/backups"

[orders]
mode = "paper"
live_enabled = false
max_order_notional = "25000"
max_daily_notional = "50000"
approval_ttl_seconds = 120
allowed_tif = ["DAY"]
require_what_if_for_short = true
require_what_if_for_options = true

[publish]
ingest_url = "https://private-dashboard.example/api/v2/portfolio/ingest"
interval_seconds = 15
